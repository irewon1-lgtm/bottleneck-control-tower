name: Bounded official sources for three DATA_WAIT targets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  targeted-official-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python .github/scripts/three_target_sources.py
      - name: Preserve only extracted snapshot and metadata on a separate result branch
        run: |
          git config user.name 'BCT bounded collection'
          git config user.email 'bct-collection@users.noreply.github.com'
          git switch --orphan "codex/three-target-source-results-${GITHUB_RUN_ID}"
          git add -- three-target-snapshot.json
          git commit -m 'Preserve bounded official source trial; no operating sidecar changes'
          git push origin HEAD
