name: Future bottleneck body candidates
on:
  push:
    branches: [main, codex/future-bottleneck, codex/bct-v33-implementation]
    paths: ['src/bct/future_*.py', 'tests/test_future*.py', '.github/scripts/future*.py', 'docs/v33-quality-*.json', '.github/workflows/future-bottleneck.yml']
  workflow_dispatch:
    inputs:
      backlog_body_recovery:
        description: Recover a frozen operational body selection through the existing pipeline
        type: boolean
        default: false
  workflow_run:
    workflows: ['RSS live environment check']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '45 22,10 * * *'  # 07:45 / 19:45 KST; retries if RSS is delayed
permissions:
  contents: write
concurrency:
  group: future-bottleneck-results
  cancel-in-progress: false
jobs:

  backlog-body-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backlog_body_recovery }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing extraction and store regressions
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_future_body_v33.py tests/test_future_store.py tests/test_future_light_prd.py
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/private-future-body-cache
          key: bct-private-body-cache-${{ hashFiles('.github/backlog-body-recovery.json') }}
      - name: Restore operational inputs using existing verified snapshot loader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin data
          mkdir -p "$RUNNER_TEMP/recovery-input" "$RUNNER_TEMP/recovery-output"
          for name in canonical.sqlite3 canonical.previous.sqlite3 state.json; do
            git show "FETCH_HEAD:$name" > "$RUNNER_TEMP/recovery-input/$name"
          done
          python .github/scripts/rss_state.py load "$RUNNER_TEMP/recovery-input" "$RUNNER_TEMP/recovery.sqlite3"
          sha256sum "$RUNNER_TEMP/recovery.sqlite3" > "$RUNNER_TEMP/recovery-db.sha256"
          python - <<'PYCODE'
          import os,json
          from pathlib import Path
          from bct.future_github import GitHubTransport
          root=Path(os.environ['RUNNER_TEMP'])/'recovery-input'
          transport=GitHubTransport(os.environ['GITHUB_REPOSITORY'],'future-bottleneck-data',os.environ['GITHUB_TOKEN'])
          for name in ('future-candidates.json','future-tracking.json'):
              (root/name).write_text(json.dumps(transport.read(name).document,ensure_ascii=False))
          PYCODE
          python .github/scripts/future_backlog_recovery.py --db "$RUNNER_TEMP/recovery.sqlite3" \
            --candidates "$RUNNER_TEMP/recovery-input/future-candidates.json" \
            --tracking "$RUNNER_TEMP/recovery-input/future-tracking.json" \
            --cache "$RUNNER_TEMP/private-future-body-cache" --request .github/backlog-body-recovery.json \
            --output "$RUNNER_TEMP/recovery-output" --publish --cache-only
          sha256sum --check "$RUNNER_TEMP/recovery-db.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backlog-body-recovery
          path: |
            ${{ runner.temp }}/recovery-output/*.json
            ${{ runner.temp }}/private-future-body-cache/*.txt
          retention-days: 1
          if-no-files-found: error

  candidates:
    # Main release is guarded by a pinned real Gates 0–6 run and code tree.
    # Existing RSS and twice-daily summaries retain their own workflows.
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.backlog_body_recovery) || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual code release gates before automatic candidates
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -e .
          python .github/scripts/bct_release_guard.py
      - name: Run full regression suite
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
          node --test tests/test_future_pages_v33.js
      - name: Read existing canonical database and prior candidate sidecar
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          mkdir -p "$RUNNER_TEMP/future-input" "$RUNNER_TEMP/future-output"
          for name in canonical.sqlite3 canonical.previous.sqlite3 state.json; do
            git show "FETCH_HEAD:$name" > "$RUNNER_TEMP/future-input/$name"
          done
          python .github/scripts/rss_state.py load "$RUNNER_TEMP/future-input" "$RUNNER_TEMP/future.sqlite3"
          sha256sum "$RUNNER_TEMP/future.sqlite3" > "$RUNNER_TEMP/future-db.sha256"
          prior=$(git ls-remote origin refs/heads/future-bottleneck-data | cut -f1)
          if [[ -n "$prior" ]]; then
            git fetch --no-tags origin "$prior"
            python - <<'PYREAD'
          import json, os
          from pathlib import Path
          from bct.future_github import GitHubTransport
          transport = GitHubTransport(os.environ['GITHUB_REPOSITORY'], 'future-bottleneck-data', os.environ['GITHUB_TOKEN'])
          head = transport.head()
          for name in ('future-candidates.json', 'future-tracking.json'):
              snapshot = transport.read_at(name, head)
              (Path(os.environ['RUNNER_TEMP']) / 'future-output' / name).write_text(json.dumps(snapshot.document, ensure_ascii=False))
          PYREAD
          fi
      - name: Screen article bodies without any AI API
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python -m bct.future_bottleneck --db "$RUNNER_TEMP/future.sqlite3" --output "$RUNNER_TEMP/future-output/future-candidates.json" \
            --tracking "$RUNNER_TEMP/future-output/future-tracking.json" \
            --cache-dir "$RUNNER_TEMP/private-future-body-cache" \
            --patch-output "$RUNNER_TEMP/future-output/collection-change.json"
          sha256sum --check "$RUNNER_TEMP/future-db.sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ['RUNNER_TEMP']) / 'future-output/future-candidates.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Candidate screening only; no final bottleneck decision.\n\n')
              compact = {k: v for k, v in state['summary'].items() if not isinstance(v, (dict, list))}
              f.write('```json\n' + json.dumps(compact, indent=2) + '\n```\n')
          PY
      - name: Frozen 100-document trial on implementation branch only
        if: github.ref == 'refs/heads/codex/bct-v33-implementation'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 9308cab93ab58a7b9d3279406cc00a6d3ec2f1cd
          git show FETCH_HEAD:canonical.sqlite3 > "$RUNNER_TEMP/frozen-quality.sqlite3"
          python .github/scripts/future_quality_trial.py \
            --db "$RUNNER_TEMP/frozen-quality.sqlite3" \
            --manifest docs/v33-quality-source-manifest.json \
            --cache-dir "$RUNNER_TEMP/private-future-body-cache" \
            --output "$RUNNER_TEMP/future-output/quality-candidates.json"
          printf '{"version":1,"targets":[],"reviews":{}}\n' > "$RUNNER_TEMP/future-output/quality-tracking.json"
          python .github/scripts/future_queue_snapshot.py \
            --candidates "$RUNNER_TEMP/future-output/quality-candidates.json" \
            --tracking "$RUNNER_TEMP/future-output/quality-tracking.json" \
            --output-dir "$RUNNER_TEMP/future-output/quality"
          python -m bct.future_quality evaluate \
            --manifest docs/v33-quality-source-manifest.json \
            --reference docs/v33-quality-reference.json \
            --candidates "$RUNNER_TEMP/future-output/quality-candidates.json" \
            --queue "$RUNNER_TEMP/future-output/quality/review-queue.json" \
            --reference-sufficient \
            --output "$RUNNER_TEMP/future-output/quality/quality-report.json"
          sha256sum --check "$RUNNER_TEMP/future-db.sha256"
      - name: Restore preserved source classifications for operating queue
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/bct_restore_operating_state.py \
            --output "$RUNNER_TEMP/operating-recovery-state"
      - name: Publish candidate sidecar only
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          publish_collection() {
            local change="$1"
            local pending="$2"
            python -m bct.future_github --path future-candidates.json \
              --change "$change" \
              --pending "$pending"
          }

          # Publish the normal pass first. If more eligible documents remain,
          # run at most two extra 300-document passes in this same Action.
          # The per-pass collection budget and worker limits are unchanged.
          publish_collection \
            "$RUNNER_TEMP/future-output/collection-change.json" \
            "$RUNNER_TEMP/future-output/pending-collection.json"

          for pass in 2 3; do
            remaining=$(python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'future-output/future-candidates.json'; print(int(json.loads(p.read_text()).get('summary',{}).get('pending_due',0) or 0))")
            if [[ "$remaining" -le 0 ]]; then
              break
            fi
            change="$RUNNER_TEMP/future-output/collection-change-$pass.json"
            pending="$RUNNER_TEMP/future-output/pending-collection-$pass.json"
            python -m bct.future_bottleneck \
              --db "$RUNNER_TEMP/future.sqlite3" \
              --output "$RUNNER_TEMP/future-output/future-candidates.json" \
              --tracking "$RUNNER_TEMP/future-output/future-tracking.json" \
              --cache-dir "$RUNNER_TEMP/private-future-body-cache" \
              --patch-output "$change"
            sha256sum --check "$RUNNER_TEMP/future-db.sha256"
            publish_collection "$change" "$pending"
          done

          # One explicit recovery pass for documents that were fetched before
          # but ended as NO_ARTICLE_CONTENT, timeout, or legacy-unverified.
          # HTTP/challenge/paywall failures are intentionally excluded.
          python - <<'PY'
          import json, os
          from pathlib import Path
          from bct.future_review import failure_index
          root = Path(os.environ['RUNNER_TEMP']) / 'future-output'
          state = json.loads((root / 'future-candidates.json').read_text())
          tracking = json.loads((root / 'future-tracking.json').read_text())
          closed = {(r['document_id'], r.get('source_version')) for r in failure_index(tracking).values()
                    if 'material' in r.get('lanes', [])}
          recovery_id = 'body-recovery-v1'
          selected = []
          recoverable = {'NO_ARTICLE_CONTENT', 'TimeoutError', 'LEGACY_COMPLETENESS_UNVERIFIED'}
          for document_id, record in state.get('results', {}).items():
              digest = record.get('current_body_sha256') or record.get('body_sha256')
              version = (record.get('versions') or {}).get(digest, {}) if digest else {}
              status = version.get('body_status') or record.get('body_status') or 'UNAVAILABLE'
              chars = version.get('body_chars') if isinstance(version.get('body_chars'), int) else record.get('body_chars', 0)
              if status != 'UNAVAILABLE' and chars > 0:
                  continue
              source_version = record.get('source_version') or record.get('fingerprint')
              if (document_id, source_version) in closed:
                  continue
              acquisition = ((record.get('acquisition') or {}).get('versions') or {}).get(source_version, {})
              if recovery_id in (acquisition.get('explicit_checks') or {}):
                  continue
              reasons = set(record.get('reasons') or []) | set((acquisition.get('latest') or {}).get('reasons') or [])
              if reasons & recoverable:
                  selected.append(document_id)
              if len(selected) >= 300:
                  break
          (root / 'recovery-ids.txt').write_text('\n'.join(selected) + ('\n' if selected else ''))
          print(f'recovery_candidates={len(selected)}')
          PY

          if [[ -s "$RUNNER_TEMP/future-output/recovery-ids.txt" ]]; then
            mapfile -t recovery_ids < "$RUNNER_TEMP/future-output/recovery-ids.txt"
            recovery_args=()
            for document_id in "${recovery_ids[@]}"; do
              recovery_args+=(--document-id "$document_id")
            done
            python -m bct.future_bottleneck \
              --db "$RUNNER_TEMP/future.sqlite3" \
              --output "$RUNNER_TEMP/future-output/future-candidates.json" \
              --tracking "$RUNNER_TEMP/future-output/future-tracking.json" \
              --cache-dir "$RUNNER_TEMP/private-future-body-cache" \
              --trigger SCHEDULED \
              --trigger-id body-recovery-v1 \
              --patch-output "$RUNNER_TEMP/future-output/recovery-change.json" \
              "${recovery_args[@]}"
            sha256sum --check "$RUNNER_TEMP/future-db.sha256"
            publish_collection \
              "$RUNNER_TEMP/future-output/recovery-change.json" \
              "$RUNNER_TEMP/future-output/pending-recovery.json"

            # Restore a source-wide final summary after the targeted recovery.
            python -m bct.future_bottleneck \
              --db "$RUNNER_TEMP/future.sqlite3" \
              --output "$RUNNER_TEMP/future-output/future-candidates.json" \
              --tracking "$RUNNER_TEMP/future-output/future-tracking.json" \
              --cache-dir "$RUNNER_TEMP/private-future-body-cache" \
              --limit 1 \
              --patch-output "$RUNNER_TEMP/future-output/final-audit-change.json"
            sha256sum --check "$RUNNER_TEMP/future-db.sha256"
            publish_collection \
              "$RUNNER_TEMP/future-output/final-audit-change.json" \
              "$RUNNER_TEMP/future-output/pending-final-audit.json"
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path
          from bct.future_github import GitHubTransport
          root = Path(os.environ['RUNNER_TEMP']) / 'future-output'
          transport = GitHubTransport(os.environ['GITHUB_REPOSITORY'], 'future-bottleneck-data', os.environ['GITHUB_TOKEN'])
          for name in ('future-candidates.json', 'future-tracking.json'):
              snapshot = transport.read(name)
              (root / name).write_text(json.dumps(snapshot.document, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              state = json.loads((root / 'future-candidates.json').read_text())
              f.write('\nFinal bounded backlog-drain state:\n\n')
              compact = {k: v for k, v in state.get('summary', {}).items() if not isinstance(v, (dict, list))}
              f.write('```json\n' + json.dumps(compact, indent=2) + '\n```\n')
          PY
          python .github/scripts/future_queue_snapshot.py \
            --candidates "$RUNNER_TEMP/future-output/future-candidates.json" \
            --tracking "$RUNNER_TEMP/future-output/future-tracking.json" \
            --output-dir "$RUNNER_TEMP/future-output"
          python .github/scripts/bct_publish_operating_queue.py \
            --output-dir "$RUNNER_TEMP/future-output" \
            --recovery-state "$RUNNER_TEMP/operating-recovery-state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-bottleneck-candidates
          path: |
            ${{ runner.temp }}/future-output/*.json
            ${{ runner.temp }}/future-output/quality/*.json
          if-no-files-found: warn
          retention-days: 14
