# One-time current-main Gate 0–6 renewal after the CPU handoff merge.
# 2026-11-13 verified manual source restore repair: request a fresh REAL Gate after merge; no bypass.
# The second job safely attests any eligible actual manual main Gate, without
# rewriting protected code or source DBs. Receipt JSON is excluded from the
# existing code_path release guard.
name: BCT Gate 0-6 release proof renewal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bct-gate-renewal-20261112.yml'
      - '.github/workflows/future-bottleneck.yml'
      - 'src/bct/future_bottleneck.py'
      - 'src/bct/future_fair_queue.py'
      - '.github/scripts/bct_auto_reader.py'
  workflow_run:
    workflows: [BCT recovery storage gates]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bct-gate-attestation-single-writer
  cancel-in-progress: false

jobs:
  dispatch-current-gates:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Request actual current-main Gate 0–6, never full_pipeline
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gates-request.json" <<'JSON'
          {"ref":"main","inputs":{"preserve_resume_only":false,"full_pipeline":false,"archive_key":"recovery"}}
          JSON
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/bct-recovery.yml/dispatches" \
            --input "$RUNNER_TEMP/gates-request.json" >/dev/null
          echo 'Gate dispatch accepted. This is not a Gate PASS.'

  attest-and-recover:
    # Do not trust nested workflow_run event fields for the job-level filter.
    # Actual eligibility and every release proof are rechecked against REST.
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      GATE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out exactly the main code tested by the completed Gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Attest real Gate steps, exact code tree and artifact before any release write
        id: attest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          import sys
          sys.path.insert(0, '.github/scripts')
          from bct_release_guard import verify_release

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GATE_RUN_ID'])

          def api(method, path):
              if method != 'GET' or not path.startswith('/'):
                  raise ValueError('GATE_READ_ONLY_VERIFICATION')
              response = subprocess.run(
                  ['gh', 'api', 'repos/'+repo+path], capture_output=True,
                  text=True, timeout=25)
              if response.returncode:
                  raise ValueError('GATE_API_READ_UNAVAILABLE')
              return json.loads(response.stdout)

          run = api('GET', '/actions/runs/'+str(run_id))
          # Non-manual and unsuccessful Gates never issue receipts or invoke readers.
          if (run.get('event') != 'workflow_dispatch'
                  or run.get('path') != '.github/workflows/bct-recovery.yml'
                  or run.get('head_branch') != 'main'
                  or (run.get('head_repository') or {}).get('full_name') != repo
                  or run.get('status') != 'completed' or run.get('conclusion') != 'success'):
              print('GATE_NON_ATTESTABLE_EVENT_NO_WRITE')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('published=false\n')
              raise SystemExit(0)
          current = api('GET', '/branches/main')
          if (run.get('id') != run_id or run.get('event') != 'workflow_dispatch'
                  or run.get('path') != '.github/workflows/bct-recovery.yml'
                  or run.get('head_branch') != 'main'
                  or run.get('head_repository', {}).get('full_name') != repo
                  or run.get('status') != 'completed' or run.get('conclusion') != 'success'
                  or run.get('head_sha') != current['commit']['sha']):
              raise ValueError('GATE_NOT_COMPLETED_FOR_CURRENT_MAIN')

          artifacts = api('GET', '/actions/runs/'+str(run_id)+'/artifacts?per_page=100')['artifacts']
          candidates = [a for a in artifacts if a.get('name') == 'bct-recovery-checkpoint-'+str(run_id)]
          if len(candidates) != 1:
              raise ValueError('GATE_CHECKPOINT_ARTIFACT_NOT_UNIQUE')
          artifact = candidates[0]
          dgst = artifact.get('digest') or ''
          if (artifact.get('expired') is not False
                  or not re.fullmatch('sha256:[0-9a-f]{64}', dgst)
                  or artifact.get('workflow_run', {}).get('id') != run_id
                  or type(artifact.get('id')) is not int):
              raise ValueError('GATE_ARTIFACT_HASH_OR_PRODUCER')
          receipt = {'gate_run_id': run_id, 'validated_code_sha': run['head_sha'],
                     'artifact_id': artifact['id'], 'artifact_sha256': dgst.split(':',1)[1]}

          # Existing production release guard must accept this *exact* receipt
          # against every protected code path and the completed Gate steps.
          proof = verify_release(api, receipt, pathlib.Path('.'))
          if proof['status'] != 'PASS' or proof['validated_code_sha'] != run['head_sha']:
              raise ValueError('GATE_RELEASE_GUARD_REJECTED')
          # Build BOTH Gate-bound receipts with the existing authenticated ZIP
          # verifier: all root hashes, inventory SHA, and original article/cache
          # bytes are validated before metadata changes.
          import tempfile
          from recovery_artifacts import API, prepare_receipts
          with tempfile.TemporaryDirectory(prefix='bct-gate-dual-',dir=os.environ['RUNNER_TEMP']) as temp:
              target=pathlib.Path(temp)/'prepared'
              proof2=prepare_receipts(API(),run_id,run['head_sha'],pathlib.Path('.'),target)
              if proof2['status']!='PREPARED_FROM_ACTUAL_CURRENT_CODE_GATE_SUCCESS':
                  raise ValueError('GATE_DUAL_RECEIPT_PREPARATION_FAILED')
              files={
                  'config/bct-operating-release.json':target/'bct-operating-release.json',
                  '.github/bct-recovery-request.json':target/'bct-recovery-request.json',
              }
              release2=json.loads(files['config/bct-operating-release.json'].read_text())
              recovery2=json.loads(files['.github/bct-recovery-request.json'].read_text())
              entry=recovery2['resume_archive']
              if (release2!=receipt or recovery2['resume_input_only'] is not False
                      or str(recovery2['resume_run_id'])!=str(run_id)
                      or entry['run_id']!=run_id or entry['head_sha']!=run['head_sha']
                      or entry['artifact_id']!=artifact['id']
                      or entry['sha256']!=receipt['artifact_sha256']
                      or not recovery2.get('resume_cache_inventory_sha256')
                      or proof2['verified_root_files']<7):
                  raise ValueError('GATE_DUAL_RECEIPT_GENERATION_MISMATCH')

              # A single Git commit moves both required JSON files together.
              # Non-force ref update rejects main-branch movement during work.
              def write_api(method,suffix,payload):
                  packet=pathlib.Path(temp)/'request.json'
                  packet.write_text(json.dumps(payload),encoding='utf-8')
                  proc=subprocess.run(['gh','api','--method',method,'repos/'+repo+suffix,
                      '--input',str(packet)],capture_output=True,text=True,timeout=45)
                  if proc.returncode:raise ValueError('GATE_ATOMIC_DUAL_RECEIPT_API_REJECTED')
                  try:return json.loads(proc.stdout)
                  except ValueError:raise ValueError('GATE_ATOMIC_DUAL_RECEIPT_BAD_API_RESPONSE')
              current=api('GET','/branches/main')
              if current['commit']['sha']!=run['head_sha']:
                  raise ValueError('MAIN_ADVANCED_BEFORE_ATOMIC_DUAL_RECEIPT')
              base=api('GET','/git/commits/'+run['head_sha'])
              tree=write_api('POST','/git/trees',{
                  'base_tree':base['tree']['sha'],
                  'tree':[{'path':path,'mode':'100644','type':'blob',
                           'content':file.read_text(encoding='utf-8')}
                          for path,file in files.items()]})
              created=write_api('POST','/git/commits',{
                  'message':'chore(bct): attest actual Gate '+str(run_id)+' and pin source resume',
                  'tree':tree['sha'],'parents':[run['head_sha']]})
              if not re.fullmatch('[0-9a-f]{40}',created.get('sha') or ''):
                  raise ValueError('GATE_ATOMIC_COMMIT_SHA_MISSING')
              write_api('PATCH','/git/refs/heads/main',
                        {'sha':created['sha'],'force':False})
              if api('GET','/branches/main')['commit']['sha']!=created['sha']:
                  raise ValueError('GATE_ATOMIC_BRANCH_READBACK_MISMATCH')
              for path,file in files.items():
                  found=api('GET','/contents/'+path+'?ref='+created['sha'])
                  if base64.b64decode(found['content'])!=file.read_bytes():
                      raise ValueError('GATE_ATOMIC_BOTH_FILES_READBACK_MISMATCH')
              print('GATE_RELEASE_RECEIPT_COMMITTED='+json.dumps({
                  'run_id':run_id,'new_main':created['sha'],
                  'dual_release_and_resume_verified':True,
                  'verified_root_files':proof2['verified_root_files']}))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('published=true\n')
          PY
      - name: Trigger existing source-free private ACK recovery, not CPU inference
        if: ${{ steps.attest.outputs.published == 'true' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recover-request.json" <<'JSON'
          {"ref":"main","inputs":{"purpose":"recover-public"}}
          JSON
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/v4-cpu-private-research.yml/dispatches" \
            --input "$RUNNER_TEMP/recover-request.json" >/dev/null
          echo 'Private ACK public-bridge recovery requested; actual success is not assumed.'
      - name: Resume existing CPU candidate cycle after BOTH Gate receipts
        if: ${{ steps.attest.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/candidates-request.json" <<'JSON'
          {"ref":"main","inputs":{"backlog_body_recovery":false}}
          JSON
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/future-bottleneck.yml/dispatches" \
            --input "$RUNNER_TEMP/candidates-request.json" >/dev/null
          echo 'Guarded CPU workflow requested; successful mixed processing is not yet proven.'
