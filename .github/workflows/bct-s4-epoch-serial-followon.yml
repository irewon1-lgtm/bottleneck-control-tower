name: BCT S4 verified private CPU epoch follow-on seven bounded runs
on:
  push:
    branches: [ops/bct-s4-epoch-cpu-remaining-157-20261116]
    paths: [.github/workflows/bct-s4-epoch-serial-followon.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: bct-s4-private-epoch-followon-exclusive-20261116
  cancel-in-progress: false
jobs:
  strictly-serial-exact-originals:
    if: ${{ github.repository == 'irewon1-lgtm/bottleneck-control-tower' && github.ref == 'refs/heads/ops/bct-s4-epoch-cpu-remaining-157-20261116' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sequentially prove each private CPU CAS save before another manual inference batch
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/bct_s4_epoch_bounded_cpu_followon.py --output s4-epoch-serial-proof.json
      - name: Preserve source-free run IDs and remote-save receipts also on partial stop
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bct-s4-epoch-serial-source-free-${{ github.run_id }}
          path: s4-epoch-serial-proof.json
          retention-days: 30
          if-no-files-found: warn
