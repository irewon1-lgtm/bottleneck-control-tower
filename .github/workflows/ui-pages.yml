name: Read-only BCT Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-pages.yml']
  workflow_run:
    workflows: ['V4 dashboard release gate', 'V4 CPU private research consumer', 'New precursor evidence acquisition', 'RSS live environment check', 'REVIEW_LEAD SHADOW intake', 'BCT recurring original-source verification backlog (bounded)', 'BCT S7 source-bound dashboard preview and 6-hour refresh QA']
    types: [completed]
    branches: [main, codex/bct-v4-integration]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments. The public data job also shares the existing canonical
# writer lock; a new Pages event must not cancel an in-flight data CAS.
concurrency:
  group: bct-readonly-pages
  cancel-in-progress: false

jobs:
  source:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           ((github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.event != 'pull_request' &&
             (github.event.workflow_run.name != 'BCT recurring original-source verification backlog (bounded)' &&
              github.event.workflow_run.name != 'BCT S7 source-bound dashboard preview and 6-hour refresh QA' ||
              github.event.workflow_run.conclusion == 'success')) ||
            (github.event.workflow_run.head_branch == 'codex/bct-v4-integration' &&
             github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.conclusion == 'success')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      code_sha: ${{ steps.source.outputs.code_sha }}
    steps:
      - name: Resolve immutable successfully verified V4 code
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/workflows/v4-dashboard-release-gate.yml/runs?branch=codex%2Fbct-v4-integration&event=push&status=success&per_page=1" > "$RUNNER_TEMP/verified.json"
          python - <<'PY'
          import json, os, re
          runs = json.load(open(os.environ['RUNNER_TEMP'] + '/verified.json'))['workflow_runs']
          if not runs:
              raise SystemExit('PAGES_VERIFIED_SOURCE_UNAVAILABLE')
          run = runs[0]
          if (run['conclusion'] != 'success' or run['event'] != 'push'
                  or run['head_branch'] != 'codex/bct-v4-integration'
                  or run['head_repository']['full_name'] != os.environ['REPOSITORY']
                  or not re.fullmatch('[0-9a-f]{40}', run['head_sha'])):
              raise SystemExit('PAGES_VERIFIED_SOURCE_INVALID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('code_sha=' + run['head_sha'] + '\n')
          PY

  sync-public:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: rss-canonical-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Public Git writes execute only this reviewed immutable core.
          # Read-only exports below may use the latest verified dashboard.
          ref: '6e788d18cf85fdb834b451bb35585a8b58925301'
          persist-credentials: false
      - name: Preserve validated public receipts on the existing data branch
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$TRIGGER_ID" ]]; then args+=(--trigger-id "$TRIGGER_ID"); fi
          python tools/v4_pages_research_input.py sync "${args[@]}"

  build:
    needs: [source, sync-public]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      manifest: ${{ steps.manifest.outputs.value }}
      s7_status_sha: ${{ steps.s7_public.outputs.status_sha }}
      s7_index_sha: ${{ steps.s7_public.outputs.index_sha }}
      s8_html_sha: ${{ steps.s8_rank.outputs.html_sha }}
      s8_report_sha: ${{ steps.s8_rank.outputs.report_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read durable public generations and build existing research UI
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          BCT_CODE_SHA: ${{ needs.source.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python tools/v4_pages_research_input.py prepare --path var/v4/pages-input
          python tools/v4_dashboard_static_export.py --commit "$BCT_CODE_SHA" --public-input var/v4/pages-input
          python tools/v4_dashboard_static_check.py
          node --check var/v4/pages-site/app.js
      - name: Verify audited S7 run and merge safe public source-truth route into pinned Pages output
        id: s7_public
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          export MAIN_SHA
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/s7-certified" "$RUNNER_TEMP/s7-code"
          gh api "repos/$REPOSITORY/actions/workflows/bct-s7-research-dashboard-preview.yml/runs?branch=main&status=success&per_page=20" > "$RUNNER_TEMP/s7-runs.json"
          python - <<'PY'
          import json,os,pathlib,re,subprocess
          source=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'s7-runs.json').read_text())
          sha=os.environ['MAIN_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          matching=[r for r in source['workflow_runs'] if r['head_sha']==sha
                    and r['name']=='BCT S7 source-bound dashboard preview and 6-hour refresh QA'
                    and r['status']=='completed' and r['conclusion']=='success'
                    and r['head_branch']=='main' and r['head_repository']['full_name']==os.environ['REPOSITORY']]
          assert matching,'BCT_S7_LATEST_MAIN_SHA_QA_MISSING_ABORT_PAGES_PUBLISH'
          run=matching[0]
          run_id=run['id']
          raw=subprocess.check_output(['gh','api',f"repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}/artifacts"])
          arts=json.loads(raw)['artifacts']
          name=f'bct-s7-source-truth-dashboard-preview-{run_id}'
          matching_arts=[a for a in arts if a['name']==name and a['workflow_run']['id']==run_id
                         and not a['expired'] and re.fullmatch(r'sha256:[a-f0-9]{64}',a.get('digest',''))
                         and 1000<a['size_in_bytes']<250000]
          assert len(matching_arts)==1,'BCT_S7_ATTESTED_PREVIEW_ARTIFACT_MISSING'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'s7-code'
          (p/'run-id.txt').write_text(str(run_id))
          (p/'artifact-id.txt').write_text(str(matching_arts[0]['id']))
          print(f'BCT_S7_SITE_APPROVED_SAME_SHA_RUN_ID={run_id}')
          PY
          S7_RUN=$(cat "$RUNNER_TEMP/s7-code/run-id.txt")
          S7_ART=$(cat "$RUNNER_TEMP/s7-code/artifact-id.txt")
          # Fetch the named, same-commit, successful and SHA-identified artifact.
          gh run download "$S7_RUN" -R "$REPOSITORY" \
            --name "bct-s7-source-truth-dashboard-preview-$S7_RUN" \
            --dir "$RUNNER_TEMP/s7-certified"
          test -s "$RUNNER_TEMP/s7-certified/s7-research-status.json"
          # Execute only the source at the same approved immutable main SHA.
          git fetch --no-tags origin "$MAIN_SHA"
          git show "$MAIN_SHA:tools/bct_s7_public_overlay.py" > "$RUNNER_TEMP/s7-code/bct_s7_public_overlay.py"
          git show "$MAIN_SHA:docs/s7-research-view.js" > "$RUNNER_TEMP/s7-code/s7-research-view.js"
          S7_RUN="$S7_RUN" node - <<'JS'
          "use strict";
          const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict");
          const root=process.env.RUNNER_TEMP;
          const view=require(path.join(root,"s7-code","s7-research-view.js"));
          const json=JSON.parse(fs.readFileSync(path.join(root,"s7-certified","s7-research-status.json"),"utf8"));
          view.validate(json);
          assert.equal(json.generations.main_code_commit,process.env.MAIN_SHA);
          assert.equal(json.historical.record_count,511);
          assert.equal(json.research.strict_original_publisher_body_date_verified,18);
          assert.equal(json.admission.eligible_independent_pair_count,0);
          console.log("BCT_S7_BROWSER_VALIDATED_JSON_FROM_SAME_MAIN_ARTIFACT_PASS");
          JS
          python "$RUNNER_TEMP/s7-code/bct_s7_public_overlay.py" \
            --site-root var/v4/pages-site \
            --source-status "$RUNNER_TEMP/s7-certified/s7-research-status.json" \
            --run-sha "$MAIN_SHA" --run-id "$S7_RUN"
          python - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path('var/v4/pages-site/source-truth')
          status=root/'status.json'
          index=root/'index.html'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('status_sha='+hashlib.sha256(status.read_bytes()).hexdigest()+'\n')
              out.write('index_sha='+hashlib.sha256(index.read_bytes()).hexdigest()+'\n')
          print('BCT_S7_PAGES_LEGACY_511_AND_SOURCE_TRUTH_OVERLAY_PASS')
          PY
      - name: Build read-only basic-analysis and evidence ranking views from sealed source generations
        id: s8_rank
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ steps.s7_public.outputs.main_sha }}
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "irewon1-lgtm/bottleneck-control-tower" ]]
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Main source was fetched by S7 above. Execute precisely that SHA.
          git show "$MAIN_SHA:tools/bct_s8_dual_ranking_overlay.py" > "$RUNNER_TEMP/bct_s8_dual_ranking_overlay.py"
          python "$RUNNER_TEMP/bct_s8_dual_ranking_overlay.py" \
            --site-root var/v4/pages-site --main-sha "$MAIN_SHA"
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('var/v4/pages-site')
          html=(root/'rankings/index.html').read_bytes()
          raw=(root/'rankings/report.json').read_bytes()
          report=json.loads(raw)
          assert report['main_code_commit']==os.environ['MAIN_SHA']
          assert report['status']=='READONLY_SEPARATE_BASIC_SCREENING_AND_SOURCE_BOUND_RANKS'
          assert report['legacy_511_preserved'] and report['new_strict_pairs_admitted']==0
          assert report['sidecar']['articles_with_screening_result']>0
          assert report['named_targets']>0 and report['evidence']['historical_records']==511
          assert b'rankings/#signals' in (root/'index.html').read_bytes()
          assert b'rankings/#evidence' in (root/'index.html').read_bytes()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('html_sha='+hashlib.sha256(html).hexdigest()+'\n')
              out.write('report_sha='+hashlib.sha256(raw).hexdigest()+'\n')
          print('BCT_TWO_RANKINGS_BUILD_AND_ORIGINALS_PRESERVED_PASS')
          PY
      - name: Bind deployment to the built public generation
        id: manifest
        run: |
          python - <<'PY'
          import json, os
          value = json.load(open('var/v4/pages-site/build-manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('value=' + json.dumps(value, separators=(',', ':')) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: var/v4/pages-site

  deploy:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.code_sha }}
          persist-credentials: false
      - name: Refuse an older research or collection generation
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          BCT_PAGES_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: python tools/v4_pages_research_input.py guard --manifest-env BCT_PAGES_MANIFEST
      - name: Publish verified static pages
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify LIVE public root and source-truth page bytes after Pages deployment
        env:
          BCT_S7_STATUS_SHA: ${{ needs.build.outputs.s7_status_sha }}
          BCT_S7_INDEX_SHA: ${{ needs.build.outputs.s7_index_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,time,json,urllib.request
          base='https://irewon1-lgtm.github.io/bottleneck-control-tower/'
          status_expected=os.environ['BCT_S7_STATUS_SHA']
          page_expected=os.environ['BCT_S7_INDEX_SHA']
          assert len(status_expected)==len(page_expected)==64
          def get(path):
              req=urllib.request.Request(base+path,headers={
                  'User-Agent':'BCT-verified-S7-public-Smoke/1.0',
                  'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  assert response.status==200
                  return response.read(300000)
          for attempt in range(1,13):
              try:
                  status=get('source-truth/status.json')
                  page=get('source-truth/index.html')
                  index=get('index.html')
                  assert hashlib.sha256(status).hexdigest()==status_expected
                  assert hashlib.sha256(page).hexdigest()==page_expected
                  assert b'./source-truth/' in index
                  s=json.loads(status)
                  assert s['historical']['record_count']==511
                  assert s['research']['strict_original_publisher_body_date_verified']==18
                  assert s['admission']['eligible_independent_pair_count']==0
                  assert b'511' in page and b'147' in page
                  print('BCT_S7_PUBLIC_PAGES_LIVE_SOURCE_TRUTH_HTTP_READBACK_PASS='+json.dumps({
                    'url':base+'source-truth/','historical':511,
                    'new_originals':18,'hints_not_ranked':147,'qualified_pairs':0,
                    'status_sha256':status_expected,'page_sha256':page_expected,
                    'http_status':200,'retry_number':attempt},sort_keys=True))
                  break
              except Exception as error:
                  print('S7_PUBLIC_BYTES_PENDING_'+str(attempt)+'_'+type(error).__name__,flush=True)
                  if attempt==12:raise
                  time.sleep(5)
          PY


      - name: Verify published dual ranking tab data and exact bytes
        env:
          BCT_S8_HTML_SHA: ${{ needs.build.outputs.s8_html_sha }}
          BCT_S8_REPORT_SHA: ${{ needs.build.outputs.s8_report_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          base='https://irewon1-lgtm.github.io/bottleneck-control-tower/'
          expected_html=os.environ['BCT_S8_HTML_SHA']
          expected_report=os.environ['BCT_S8_REPORT_SHA']
          assert len(expected_html)==len(expected_report)==64
          def read(path):
              req=urllib.request.Request(base+path,headers={
                  'Cache-Control':'no-cache','User-Agent':'BCT-dual-ranking-live-smoke'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  assert response.status==200
                  return response.read(1600000)
          for attempt in range(1,13):
              try:
                  html=read('rankings/index.html')
                  proof=read('rankings/report.json')
                  index=read('index.html')
                  assert hashlib.sha256(html).hexdigest()==expected_html
                  assert hashlib.sha256(proof).hexdigest()==expected_report
                  assert b'./rankings/#signals' in index and b'./rankings/#evidence' in index
                  assert b'id="signals"' in html and b'id="evidence"' in html
                  d=json.loads(proof)
                  assert d['legacy_511_preserved'] is True
                  assert d['new_strict_pairs_admitted']==0
                  assert d['sidecar']['articles_with_screening_result']>0
                  assert d['named_targets']>=d['displayed_targets']>=1
                  assert d['evidence']['historical_sector_records']==508
                  print('BCT_DUAL_RANKINGS_LIVE_HTTP_BYTES_AND_LINEAGE_PASS='+json.dumps({
                    'url':base+'rankings/','analysis_results':d['sidecar']['articles_with_screening_result'],
                    'ranked_targets':d['named_targets'],'historical_source_records':511,
                    'new_strict_pairs':0,'run_attempt':attempt},sort_keys=True))
                  break
              except Exception as err:
                  print('BCT_S8_PUBLIC_BYTES_PENDING_'+str(attempt)+'_'+type(err).__name__,flush=True)
                  if attempt==12:raise
                  time.sleep(5)
          PY
