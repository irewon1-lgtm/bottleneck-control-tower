name: Read-only BCT Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui-pages.yml']
  workflow_run:
    workflows: ['V4 dashboard release gate']
    types: [completed]
    branches: [codex/bct-v4-integration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bct-readonly-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'codex/bct-v4-integration' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bct-v4-integration
          persist-credentials: false
      - name: Only export the latest successfully verified V4 source
        id: source
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "BCT_CODE_SHA=$actual" >> "$GITHUB_ENV"
          if [[ "$EVENT" == 'workflow_run' && "$actual" != "$VERIFIED_SHA" ]]; then
            echo 'Stale verification result, skip without altering deployed site.'
            echo 'publish=no' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=yes' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.publish == 'yes'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.source.outputs.publish == 'yes'
        with:
          node-version: '24'
      - name: Build public static research and verify all evidence
        if: steps.source.outputs.publish == 'yes'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python tools/v4_dashboard_static_export.py --commit "$BCT_CODE_SHA"
          python tools/v4_dashboard_static_check.py
          node --check var/v4/pages-site/app.js
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.publish == 'yes'
      - uses: actions/upload-pages-artifact@v4
        if: steps.source.outputs.publish == 'yes'
        with:
          path: var/v4/pages-site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static pages
        uses: actions/deploy-pages@v4
        id: deployment
