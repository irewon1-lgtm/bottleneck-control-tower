name: Read-only BCT Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/export_ui_snapshot.py'
      - '.github/workflows/ui-pages.yml'
      - '.github/workflows/rss-ai.yml'
      - 'rss_feeds.yaml'
  workflow_run:
    workflows: ['RSS live environment check', 'RSS AI annotation']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bct-readonly-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependencies
        run: python -m pip install -e .
      - name: Read canonical data branch and generate UI-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          mkdir -p "$RUNNER_TEMP/bct-ui-source"
          git show FETCH_HEAD:canonical.sqlite3 > "$RUNNER_TEMP/bct-ui-source/canonical.sqlite3"
          git show FETCH_HEAD:state.json > "$RUNNER_TEMP/bct-ui-source/state.json"
          python .github/scripts/export_ui_snapshot.py \
            --database "$RUNNER_TEMP/bct-ui-source/canonical.sqlite3" \
            --state "$RUNNER_TEMP/bct-ui-source/state.json" \
            --output docs/snapshot.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish static UI
        id: deployment
        uses: actions/deploy-pages@v4
