name: Stage 0 tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: node --test tests/*.js
      # Fixed-input QA for this cutover only; expiry cannot break later CI.
      # The regular six-per-day RSS schedule and write workflows are untouched.
      - name: Restore fixed real-source QA snapshot
        if: ${{ github.head_ref == 'fix/precursor-source-pipeline-20261009' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'BCT source pipeline QA')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37790294699 --name precursor-private-cache --dir var/fixed-precursor-qa
      - name: Verify 230 originals through the operating wrapper without network or LIVE writes
        if: ${{ github.head_ref == 'fix/precursor-source-pipeline-20261009' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'BCT source pipeline QA')) }}
        run: python tools/precursor_operating_qa.py --cache var/fixed-precursor-qa --output var/qa/operating-report.json
      - uses: actions/upload-artifact@v4
        if: ${{ github.head_ref == 'fix/precursor-source-pipeline-20261009' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'BCT source pipeline QA')) }}
        with:
          name: source-pipeline-qa
          path: var/qa/operating-report.json
          retention-days: 30
