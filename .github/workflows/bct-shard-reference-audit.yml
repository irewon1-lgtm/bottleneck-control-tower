name: BCT read-only sidecar reference audit
on:
  push:
    branches: [ops/bct-shard-reference-audit-20261013]
    paths: [.github/scripts/bct_shard_reference_audit.py, .github/workflows/bct-shard-reference-audit.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Audit every current document and non-shard file reference without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/bct_shard_reference_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-shard-reference-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/bct-shard-reference-audit/reference-audit.json
          retention-days: 30
          if-no-files-found: error
