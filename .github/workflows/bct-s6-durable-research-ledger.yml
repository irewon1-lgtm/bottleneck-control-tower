name: BCT S6 durable sourcefree research-only SQLite CAS and fresh readback
on:
  push:
    branches: [ops/bct-s6-durable-sourcefree-ledger-20261116]
    paths:
      - tools/bct_s6_durable_sourcefree_research.py
      - tests/test_bct_s6_durable_sourcefree_research.py
      - .github/workflows/bct-s6-durable-research-ledger.yml
permissions:
  contents: read
concurrency:
  group: bct-s6-research-immutable-316-60-22-20-147-ledger
  cancel-in-progress: false
jobs:
  anti-false-pair-and-immutable-parent-tests:
    if: ${{ github.repository == 'irewon1-lgtm/bottleneck-control-tower' && github.ref == 'refs/heads/ops/bct-s6-durable-sourcefree-ledger-20261116' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Verify synthetic error cases and exact-sized durable SQLite evidence schema
        shell: bash
        env:
          PYTHONPATH: src:tools
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_bct_s6_durable_sourcefree_research.py -v
  sourcefree-durable-append-only-cas:
    needs: anti-false-pair-and-immutable-parent-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src:tools
      RESEARCH_BRANCH: research/bct-s6-sourcefree-ledger-20261116
      DATA_FOLDER: research/bct-v4/s6-316-60-20261116
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Authenticate exact successful parent GitHub runs and artifact identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parents/316" "$RUNNER_TEMP/parents/60"
          python - <<'PY'
          import json,os,subprocess
          expected=[
            (43857086796,'1c266920f8db2e9588342305670d7e5f6efaba9c',
             14220458504,'bct-s6-316-sourcefree-research-43857086796',
             'sha256:542d38565e7bf13051fb11e0c3f5b8d9de6f7c16b2d7a27c55d1f2d480e6c5eb'),
            (43861667664,'edbdf61ea877eaa586af43b4bdc9c19dec02e8ad',
             14224420540,'bct-s6-real-60-original-sourcefree-43861667664',
             'sha256:07584445de593e7d65923d6e17cbd39513bc6f6c8bd6df41e796de1b42e052e3')
          ]
          repo=os.environ['GITHUB_REPOSITORY']
          for run,sha,art,name,digest in expected:
              r=json.loads(subprocess.check_output([
                  'gh','api',f'repos/{repo}/actions/runs/{run}']))
              a=json.loads(subprocess.check_output([
                  'gh','api',f'repos/{repo}/actions/artifacts/{art}']))
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['id']==run and r['head_sha']==sha
              assert a['id']==art and a['digest']==digest and a['name']==name
              assert a['workflow_run']['id']==run and not a['expired']
          print('BCT_S6_DURABLE_TWO_REAL_SOURCE_FREE_PARENT_SHA_IDENTITY_PASS')
          PY
          gh run download 43857086796 -R "$GITHUB_REPOSITORY" \
            --name bct-s6-316-sourcefree-research-43857086796 \
            --dir "$RUNNER_TEMP/parents/316"
          gh run download 43861667664 -R "$GITHUB_REPOSITORY" \
            --name bct-s6-real-60-original-sourcefree-43861667664 \
            --dir "$RUNNER_TEMP/parents/60"
      - name: Produce genuine normalized cross-table research SQLite with zero qualified-pair claims
        shell: bash
        run: |
          set -euo pipefail
          python tools/bct_s6_durable_sourcefree_research.py \
            --parent316 "$RUNNER_TEMP/parents/316" \
            --parent60 "$RUNNER_TEMP/parents/60" \
            --out "$RUNNER_TEMP/research-prepared"
          python tools/bct_s6_durable_sourcefree_research.py \
            --verify-only --out "$RUNNER_TEMP/research-prepared"
          cp tools/bct_s6_durable_sourcefree_research.py "$RUNNER_TEMP/sourcefree-verifier.py"
      - name: Append only to dedicated research-owned GitHub branch, never canonical or LIVE
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RESEARCH_BRANCH"
          prior_sha=$(git rev-parse FETCH_HEAD)
          git switch -C "$RESEARCH_BRANCH" "$prior_sha"
          mkdir -p "$DATA_FOLDER"
          if test -e "$DATA_FOLDER/research-sourcefree.sqlite3" ||
             test -e "$DATA_FOLDER/research-summary.json"; then
            test -f "$DATA_FOLDER/research-sourcefree.sqlite3"
            test -f "$DATA_FOLDER/research-summary.json"
            cmp "$RUNNER_TEMP/research-prepared/research-sourcefree.sqlite3" \
                "$DATA_FOLDER/research-sourcefree.sqlite3"
            cmp "$RUNNER_TEMP/research-prepared/research-summary.json" \
                "$DATA_FOLDER/research-summary.json"
            echo "BCT_S6_RESEARCH_APPEND_ONLY_ALREADY_SAME_BYTES"
          else
            cp "$RUNNER_TEMP/research-prepared/research-sourcefree.sqlite3" "$DATA_FOLDER/"
            cp "$RUNNER_TEMP/research-prepared/research-summary.json" "$DATA_FOLDER/"
            # The project globally ignores *.sqlite3; this explicitly
            # scoped research-only proof file is intentionally tracked.
            git add -f "$DATA_FOLDER/research-sourcefree.sqlite3"
            git add "$DATA_FOLDER/research-summary.json"
            git -c user.name='bct-sourcefree-research-bot' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'data(S6): append verified sourcefree 316/60/22/20/147 research evidence only'
            git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
          fi
          echo "RESEARCH_DATA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BCT_S6_DURABLE_RESEARCH_BRANCH_PUSH_COMPLETE"
      - name: Fresh remote readback of exact published branch and SQLite
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RESEARCH_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$RESEARCH_DATA_SHA"
          mkdir -p "$RUNNER_TEMP/remote-requery"
          git show "FETCH_HEAD:$DATA_FOLDER/research-sourcefree.sqlite3" \
            > "$RUNNER_TEMP/remote-requery/research-sourcefree.sqlite3"
          git show "FETCH_HEAD:$DATA_FOLDER/research-summary.json" \
            > "$RUNNER_TEMP/remote-requery/research-summary.json"
          cmp "$RUNNER_TEMP/research-prepared/research-sourcefree.sqlite3" \
              "$RUNNER_TEMP/remote-requery/research-sourcefree.sqlite3"
          cmp "$RUNNER_TEMP/research-prepared/research-summary.json" \
              "$RUNNER_TEMP/remote-requery/research-summary.json"
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
            python "$RUNNER_TEMP/sourcefree-verifier.py" \
              --verify-only --out "$RUNNER_TEMP/remote-requery"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'remote-requery/research-summary.json'
          x=json.loads(p.read_text())
          assert x['source_counts']=={
           'article_intake':316,'source_reentry_plan':60,
           'target_holds':22,'research_facts':20,
           'source_attempts':60,'source_bound_hints':147}
          assert x['strict_eligible_independent_pairs_admitted']==0
          assert x['data_or_future_branch_writes']==x['LIVE_writes']==x['public_Pages_deploys']==0
          print('BCT_S6_REAL_CAS_DURABLE_RESEARCH_DB_READBACK_PASS='+json.dumps({
            'branch':os.environ['RESEARCH_BRANCH'],
            'sha':os.environ['RESEARCH_DATA_SHA'],
            'articles':316,'actual_source_attempts':60,
            'source_originals_verified':18,'target_holds':22,
            'original_fact_codes':20,'new_source_hints':147,
            'qualified_independent_pairs':0,'LIVE_writes':0,
            'sqlite_sha256':x['sqlite_sha256']
          },sort_keys=True))
          PY
      - name: Artifact holds only source-free summary (durable SQLite already on research branch)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bct-s6-durable-research-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/research-prepared/research-summary.json
          retention-days: 30
          if-no-files-found: warn
