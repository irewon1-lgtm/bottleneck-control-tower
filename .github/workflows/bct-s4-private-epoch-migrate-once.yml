name: BCT S4 dedicated epoch CPU manual dispatch one shot
on:
  push:
    branches: [ops/bct-s4-private-epoch-migrate-20261116]
    paths: [.github/workflows/bct-s4-private-epoch-migrate-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-one-verified-epoch-cpu:
    if: ${{ github.repository == 'irewon1-lgtm/bottleneck-control-tower' && github.ref == 'refs/heads/ops/bct-s4-private-epoch-migrate-20261116' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: a85e86fad091e10ea2df13211a0687e4166e6e0f
    steps:
      - name: Request only manual verified original cohort on existing independent epoch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43645932280" --jq '.conclusion+":"+.head_branch+":"+.name')" == 'success:main:New precursor evidence acquisition' ]]
          jq -n '{ref:"main",inputs:{purpose:"manual-research",acquisition_run:"43645932280"}}' > "$RUNNER_TEMP/epoch-exact-once.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/bct-s4-epoch-cpu-manual.yml/dispatches" --input "$RUNNER_TEMP/epoch-exact-once.json"
          echo BCT_S4_EPOCH_CPU_MANUAL_REQUEST_ACCEPTED

# Explicit fast-forward verified one-shot Git ref update; no behavior change
