name: Temporary AI quality sample
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Export current SIGNAL article sample from data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          git show FETCH_HEAD:canonical.sqlite3 > "$RUNNER_TEMP/canonical.sqlite3"
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from bct.radar_signals import extract

          db_path = Path(__import__('os').environ['RUNNER_TEMP']) / 'canonical.sqlite3'
          rows = []
          with sqlite3.connect(db_path) as db:
              db.row_factory = sqlite3.Row
              items = db.execute("""
                  SELECT id, source, title, snippet, published_at, collected_at
                  FROM radar_items
                  WHERE status='active'
                  ORDER BY collected_at DESC, id DESC
              """).fetchall()
          for item in items:
              signals = extract(item['title'], item['snippet'])
              if not signals:
                  continue
              rows.append({
                  'radar_item_id': item['id'],
                  'source': item['source'],
                  'title': item['title'],
                  'snippet': item['snippet'],
                  'published_at': item['published_at'],
                  'collected_at': item['collected_at'],
                  'signals': signals,
              })
              if len(rows) >= 20:
                  break
          Path('ai-quality-sample.json').write_text(
              json.dumps({'count': len(rows), 'items': rows}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps({'signal_sample_count': len(rows)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-quality-sample
          path: ai-quality-sample.json
          if-no-files-found: error
