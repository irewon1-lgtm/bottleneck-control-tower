name: BCT S4 CPU drain runner parse proof
on:
  push:
    branches: [ops/bct-s4-remaining-exact-cpu-20261116]
    paths:
      - .github/workflows/bct-s4-drain-execute.yml
permissions:
  contents: read
  actions: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Validate workflow parser before any CPU action
        run: echo BCT_S4_EXECUTOR_WORKFLOW_PARSE_OK > "$RUNNER_TEMP/bct-s4-proof.txt"
      - name: Save source-free parser verification artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bct-s4-parse-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/bct-s4-proof.txt
          retention-days: 30
