name: V4 dashboard release gate
on:
  workflow_dispatch:
  push:
    branches: [codex/bct-v4-integration]
  pull_request:
    branches: [codex/bct-v4-integration]
permissions:
  contents: read
concurrency:
  group: v4-dashboard-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source, API, export and read-only boundaries
        env:
          COMMIT_REF: ${{ github.sha }}
        run: bash scripts/v4_dashboard_ci_build.sh
      # Netlify runs the same gate before atomic publication. No deployment
      # token, research output artifact, collector, or write permission is used.

  readonly-release-revalidation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: review-code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 14c2de541ced1f995f3725d67a37e7fdb1b4898d
          fetch-depth: 0
          path: released-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test requirements without a CPU model
        working-directory: released-main
        run: timeout 120 python -m pip install -e '.[test]'
      - name: Verify exact main code and three read-only research additions
        env:
          PYTHONPATH: released-main/src
        run: timeout 120 python review-code/tools/v4_release_revalidate.py --root released-main --output release-revalidation.json
      - name: Revalidate current main Python tests
        working-directory: released-main
        env:
          PYTHONPATH: src
        run: timeout 120 python -m pytest -q
      - name: Revalidate current main JavaScript tests
        working-directory: released-main
        run: timeout 120 node --test tests/*.js
      - name: Restore fixed original corpus read-only
        uses: actions/download-artifact@v4
        with:
          name: precursor-private-cache
          run-id: 37790294699
          github-token: ${{ github.token }}
          path: released-main/var/release-fixed-230
      - name: Revalidate fixed230 offline without network or LIVE writes
        working-directory: released-main
        env:
          PYTHONPATH: src
        run: timeout 120 python tools/precursor_operating_qa.py --cache var/release-fixed-230 --output var/release-qa/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: readonly-release-revalidation
          path: release-revalidation.json
          retention-days: 14
          if-no-files-found: error
