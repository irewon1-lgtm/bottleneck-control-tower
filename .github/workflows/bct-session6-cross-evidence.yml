name: BCT Session 6 exact original independent demand supply audit
on:
  push:
    branches: [research/bct-session6-cross-evidence-20261113]
    paths:
      - '.github/workflows/bct-session6-cross-evidence.yml'
      - 'tools/bct_session6_cross_evidence.py'
      - 'tests/test_bct_session6_cross_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bct-session6-45-readonly
  cancel-in-progress: false
jobs:
  cross-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .:src
      INPUT_RUN: 43341520709
      INPUT_HEAD_SHA: 0fe92cb971bd03a9ff67ed8ee5ac63ac02983790
      INPUT_ARTIFACT_ID: 13999008324
      INPUT_ARTIFACT_DIGEST: sha256:66c473aa027ade5cfd86a3e91377391dbaf19e9627ed6436700bf00bddf6a26b
    steps:
      - name: Checkout immutable code without production write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress source-identity, exact-hash, graph and false-pair cases
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python -m pytest -q \
            tests/test_bct_session6_cross_evidence.py \
            tests/test_precursor_evidence_graph.py \
            tests/test_bct_session5_semantic_shadow.py
      - name: Verify exact 302-document predecessor and download metadata only
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN" |
            jq -e --arg sha "$INPUT_HEAD_SHA" \
              '.name == "BCT Session 5 HTTP original-only targeted repair" and .status == "completed" and .conclusion == "success" and .head_sha == $sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN/artifacts?per_page=100" |
            jq -e --argjson id "$INPUT_ARTIFACT_ID" --arg digest "$INPUT_ARTIFACT_DIGEST" --argjson run "$INPUT_RUN" \
              '[.artifacts[] | select(.id == $id and .name == "bct-session5-nine-http-reconciled-302" and .digest == $digest and .expired == false and .workflow_run.id == $run)] | length == 1' >/dev/null
          mkdir -p "$RUNNER_TEMP/s6/in"
          gh run download "$INPUT_RUN" --name bct-session5-nine-http-reconciled-302 \
            --dir "$RUNNER_TEMP/s6/in"
          test -s "$RUNNER_TEMP/s6/in/merged_302_status.csv"
          python - <<'PY'
          from pathlib import Path
          from tools.bct_session6_cross_evidence import read_frozen
          import os
          root=Path(os.environ["RUNNER_TEMP"])/"s6/in"
          frozen=read_frozen(root/"merged_302_status.csv")
          assert len(frozen)==45
          print("BCT_SESSION6_PINNED_45_S5_ORIGINALS_PASS")
          PY
      - name: Reacquire 45 exact originals, no login bypass, BACKFILL graph only
        shell: bash
        run: |
          set -euo pipefail
          python tools/bct_session6_cross_evidence.py \
            --previous "$RUNNER_TEMP/s6/in/merged_302_status.csv" \
            --output "$RUNNER_TEMP/s6/result"
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"s6/result"
          summary=json.loads((root/"cross_evidence_summary.json").read_text())
          with (root/"per_article_evidence_status_45.csv").open(
              encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          assert summary["status"]=="PASS_COMPLETED_READ_ONLY_SOURCE_AUDIT"
          assert summary["reaccess_attempted"]==45==len(rows)
          assert len({r["document_id"] for r in rows})==45
          assert summary["S1_S2_S3_new"]==summary["eligible_verified_bottlenecks"]==0
          assert summary["operating_branch_or_db_writes"]==0
          assert summary["source_body_redistributed"] is False
          assert summary["independent_demand_supply_pairs"] == summary["existing_graph"]["independent_demand_supply_pairs"]
          print("BCT_S6_CROSS_EVIDENCE_COMPLETE="+json.dumps({
              "source_reaccess":summary["source_reaccess_counts"],
              "same_hash_verified":summary["current_same_hash_verified"],
              "issuer_primary_verified":summary["issuer_primary_verified"],
              "independent_pairs":summary["independent_demand_supply_pairs"],
              "verified_bottlenecks":summary["eligible_verified_bottlenecks"]}))
          PY
      - name: Summarize evidence and explicitly disclose incompleteness
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/s6/result/session6_report.md"; then
            cat "$RUNNER_TEMP/s6/result/session6_report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SESSION6_INCOMPLETE: cannot confirm independent verified cross-supply pairs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish only short metadata receipts, never original HTML/text
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-session6-cross-evidence-45
          path: |
            ${{ runner.temp }}/s6/result/cross_evidence_summary.json
            ${{ runner.temp }}/s6/result/per_article_evidence_status_45.csv
            ${{ runner.temp }}/s6/result/independent_pair_research_queue.csv
            ${{ runner.temp }}/s6/result/session6_report.md
          retention-days: 30
          if-no-files-found: warn
