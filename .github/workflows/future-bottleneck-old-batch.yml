name: Future bottleneck older-batch validation\n# final validation rerun
on:
  push:
    branches: [codex/future-bottleneck]
    paths: ['.github/workflows/future-bottleneck-old-batch.yml']
permissions:
  contents: read
jobs:
  validate-older:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Rebuild canonical database read-only input
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          mkdir -p "$RUNNER_TEMP/future-input" "$RUNNER_TEMP/future-output"
          for name in canonical.sqlite3 canonical.previous.sqlite3 state.json; do
            git show "FETCH_HEAD:$name" > "$RUNNER_TEMP/future-input/$name"
          done
          python .github/scripts/rss_state.py load "$RUNNER_TEMP/future-input" "$RUNNER_TEMP/canonical.sqlite3"
          sha256sum "$RUNNER_TEMP/canonical.sqlite3" > "$RUNNER_TEMP/canonical.sha256"
      - name: Build older independent batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sqlite3
          src = os.path.join(os.environ["RUNNER_TEMP"], "canonical.sqlite3")
          dst = os.path.join(os.environ["RUNNER_TEMP"], "older.sqlite3")
          with sqlite3.connect(dst) as db:
              db.execute("ATTACH DATABASE ? AS src", (src,))
              db.execute(
                  """CREATE TABLE radar_items AS
                     SELECT id,title,url,source,collected_at,updated_at,status,source_type
                     FROM src.radar_items
                     WHERE status='active' AND source_type='NEWS'
                     ORDER BY collected_at DESC,id DESC
                     LIMIT -1 OFFSET 300"""
              )
              remaining = db.execute("SELECT COUNT(*) FROM radar_items").fetchone()[0]
              print(f"older_batch_news={remaining}")
          PY
      - name: Screen older article bodies
        shell: bash
        run: |
          set -euo pipefail
          python -m bct.future_bottleneck             --db "$RUNNER_TEMP/older.sqlite3"             --output "$RUNNER_TEMP/future-output/older-candidates.json"             --limit 300
          sha256sum --check "$RUNNER_TEMP/canonical.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-bottleneck-older-batch
          path: ${{ runner.temp }}/future-output/older-candidates.json
          if-no-files-found: warn
