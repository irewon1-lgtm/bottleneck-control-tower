name: BCT publication resume regression before and after
on:
  push:
    branches: [fix/bct-publication-budget-resume-20261013]
    paths: [.github/scripts/bct_wait_publication.py, .github/scripts/bct_operating_recovery.py, tests/test_operating_publication_wait.py, .github/workflows/bct-publication-resume-probe.yml]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Reproduce stale prior publication on actual old code, then verify correction
        run: |
          cp .github/scripts/bct_wait_publication.py "$RUNNER_TEMP/fixed-publication.py"
          git fetch --no-tags --depth=1 origin d4b3130f8a5c0f2261fa851c7a35cb1c19fd5b5c
          git show d4b3130f8a5c0f2261fa851c7a35cb1c19fd5b5c:.github/scripts/bct_wait_publication.py > .github/scripts/bct_wait_publication.py
          set +e
          python -m pytest -q tests/test_operating_publication_wait.py > "$RUNNER_TEMP/before-publication.txt" 2>&1
          before_status=$?
          set -e
          cat "$RUNNER_TEMP/before-publication.txt"
          test "$before_status" -eq 1
          cp "$RUNNER_TEMP/fixed-publication.py" .github/scripts/bct_wait_publication.py
          python -m pytest -q tests/test_operating_publication_wait.py
      - name: Existing recovery engine and storage regression
        run: |
          python -m pytest -q tests/test_recovery_engine.py tests/test_future_github_atomic.py tests/test_future_store.py
          python -m compileall -q src .github/scripts
