name: Temporary refined body radar simulation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-refined-body-radar.yml']
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install trafilatura requests
      - name: Refined scan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          git show FETCH_HEAD:canonical.sqlite3 > /tmp/canonical.sqlite3
          python - <<'PY'
          import json,re,sqlite3,requests,concurrent.futures
          from pathlib import Path
          import trafilatura
          db=sqlite3.connect('/tmp/canonical.sqlite3'); db.row_factory=sqlite3.Row
          rows=[dict(r) for r in db.execute("select id,source,title,snippet,url,published_at,collected_at from radar_items where status='active' order by coalesce(published_at,collected_at) desc,id desc limit 100")]
          demand=re.compile(r"\b(?:demand (?:is |will |expected to |projected to )?(?:grow|increase|rise|surge|double|outpace|accelerat)|record orders?|orders? (?:surged|jumped|increased)|fully (?:booked|allocated)|capacity booked)\b",re.I)
          constraint=re.compile(r"\b(?:supply[- ]chain bottlenecks?|manufacturing throughput limits?|capacity constraints?|capacity constrained|constrained capacity|unable to meet demand|cannot meet demand|demand exceeds supply|single[- ]source|sole supplier|only (?:one|two|three) (?:qualified )?suppliers?|limited (?:number of )?(?:qualified )?suppliers?|long lead times?|lead times? (?:of|have|has|rose|increased|extended)|order books? (?:are )?(?:backlogged|booked)|backlogged? (?:for )?(?:years?|months?)|qualification takes?|certification takes?|shortage of (?!skilled|workers?|contractors?|crews?|staff|labor|labour))\b",re.I)
          relief=re.compile(r"\b(?:capacity expansion|expand(?:ing|ed)? capacity|new (?:plant|production line|fab|factory|mill)|second source|new supplier|ramp(?:ing)? up production|commercial production|capacity (?:online|coming online))\b",re.I)
          timing=re.compile(r"\b(?:not (?:expected|available|online) until|expected (?:by|in)|scheduled (?:for|to)|by 20(?:2[7-9]|3\d)|in 20(?:2[7-9]|3\d)|through 20(?:2[7-9]|3\d)|multi[- ]year lead time|\d{1,2}[- ]month lead time|years? out)\b",re.I)
          labor=re.compile(r"\b(?:skilled workers?|contractors?|crews?|staff|labor|labour|electricians?|tradespeople|workforce)\b",re.I)
          technical=re.compile(r"\b(?:data transfers?|PCIe|throughput|latency|software bottleneck|memory[- ]related|compute bottleneck|network bottleneck)\b",re.I)
          headers={'User-Agent':'Mozilla/5.0 (BCT research body radar test)'}
          def one(r):
              rec={k:r.get(k) for k in ('id','source','title','url')}
              try:
                  resp=requests.get(r['url'],headers=headers,timeout=12,allow_redirects=True)
                  text=trafilatura.extract(resp.text,include_comments=False,include_tables=False,favor_precision=True) or ''
                  ok=resp.status_code<400 and len(text)>=300
                  rec.update(http_status=resp.status_code,body_ok=ok,body_chars=len(text))
                  if not ok:
                      rec.update(candidate=False,reason='BODY_UNAVAILABLE'); return rec
                  ds=list(demand.finditer(text)); cs=list(constraint.finditer(text)); rs=list(relief.finditer(text)); ts=list(timing.finditer(text))
                  labor_only=bool(labor.search(text)) and not cs
                  tech_context=bool(technical.search(text))
                  windows=[]
                  for name,ms in [('DEMAND',ds),('CONSTRAINT',cs),('RELIEF',rs),('TIMING',ts)]:
                      for m in ms[:2]:
                          a=max(0,m.start()-150); b=min(len(text),m.end()+260)
                          windows.append({'group':name,'text':' '.join(text[a:b].split())[:550]})
                  # Future discovery requires an actual supply-side constraint. Relief/timing are supporting evidence only.
                  candidate=bool(cs and (ds or ts or rs))
                  # Exclude labor-only or purely technical/performance bottlenecks unless a supply-side phrase exists.
                  if labor_only: candidate=False
                  if tech_context and not re.search(r"\b(?:supplier|supply chain|capacity constrained|manufacturing throughput|lead time|order books?|backlogged)\b",text,re.I):
                      candidate=False
                  rec.update(candidate=candidate,hits={'DEMAND':len(ds),'CONSTRAINT':len(cs),'RELIEF':len(rs),'TIMING':len(ts)},windows=windows[:8])
              except Exception as e:
                  rec.update(body_ok=False,candidate=False,reason=type(e).__name__)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              out=list(ex.map(one,rows))
          result={'tested':len(out),'body_ok':sum(x.get('body_ok',False) for x in out),'body_failed':sum(not x.get('body_ok',False) for x in out),'future_candidates':sum(x.get('candidate',False) for x in out),'candidates':[x for x in out if x.get('candidate')]}
          Path('refined-body-radar.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k!='candidates'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refined-body-radar
          path: refined-body-radar.json
          if-no-files-found: error
