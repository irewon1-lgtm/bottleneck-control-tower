name: BCT Session 6 publisher versus issuer audit correction
on:
  push:
    branches: [research/bct-session6-cross-evidence-20261113]
    paths:
      - '.github/workflows/bct-session6-source-role-correction.yml'
      - 'tools/bct_session6_source_role_correction.py'
      - 'tests/test_bct_session6_source_role_correction.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bct-s6-metadata-correction-no-refetch
  cancel-in-progress: false
jobs:
  correct-primary-source-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .:src
      PRIOR_RUN: 43344245036
      PRIOR_HEAD_SHA: 37ca86cdaf10c6353fc17e312508906687f73fc6
      PRIOR_ARTIFACT_ID: 14000324266
      PRIOR_ARTIFACT_DIGEST: sha256:a80bc8d15ff5daeed536c96df865b1939e3f0683d2d7a17b485e7c95b73d6c47
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regression of official issuer versus news publisher status
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_bct_session6_source_role_correction.py
      - name: Restore exactly the previous 45-source metadata receipt, no new publisher requests
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" |
            jq -e --arg sha "$PRIOR_HEAD_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .name=="BCT Session 6 exact original independent demand supply audit"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN/artifacts?per_page=100" |
            jq -e --argjson id "$PRIOR_ARTIFACT_ID" --arg digest "$PRIOR_ARTIFACT_DIGEST" --argjson run "$PRIOR_RUN" \
              '[.artifacts[] | select(.id==$id and .name=="bct-session6-cross-evidence-45" and .digest==$digest and .expired==false and .workflow_run.id==$run)] | length==1' >/dev/null
          mkdir -p "$RUNNER_TEMP/s6-correct/input"
          gh run download "$PRIOR_RUN" --name bct-session6-cross-evidence-45 \
            --dir "$RUNNER_TEMP/s6-correct/input"
          test -s "$RUNNER_TEMP/s6-correct/input/cross_evidence_summary.json"
          test -s "$RUNNER_TEMP/s6-correct/input/per_article_evidence_status_45.csv"
      - name: Correct the 4 optimistic publisher-origin labels without refetch
        shell: bash
        run: |
          set -euo pipefail
          python tools/bct_session6_source_role_correction.py \
            --previous-summary "$RUNNER_TEMP/s6-correct/input/cross_evidence_summary.json" \
            --previous-documents "$RUNNER_TEMP/s6-correct/input/per_article_evidence_status_45.csv" \
            --output "$RUNNER_TEMP/s6-correct/result"
          python - <<'PY'
          import os,json,csv
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"s6-correct/result"
          report=json.loads((p/"session6_corrected_summary.json").read_text())
          with (p/"session6_evidence_45_corrected.csv").open(encoding="utf-8-sig",newline="") as f:
              records=list(csv.DictReader(f))
          assert report["status"]=="PASS_CONSERVATIVE_RECLASSIFICATION"
          assert len(records)==45 and len({r["document_id"] for r in records})==45
          assert report["primary_origin_heuristic_positives_not_independent_issuer_sources"]==4
          assert report["primary_issuer_source_verified"]==0
          assert report["independent_demand_supply_pairs"]==report["S1_S2_S3_promotions"]==0
          assert report["source_http_requests"]==report["AI_model_calls"]==0
          print("BCT_S6_SOURCE_ROLE_CORRECTION_PASS_45")
          PY
      - name: Publish conservative source-role receipt
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/s6-correct/result/session6_corrected_report.md"; then
            cat "$RUNNER_TEMP/s6-correct/result/session6_corrected_report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "S6 conservative source-role verification INCOMPLETE; do not promote supply candidate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep corrected labels and reasons without article text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bct-session6-corrected-news-versus-issuer-45
          path: |
            ${{ runner.temp }}/s6-correct/result/session6_corrected_summary.json
            ${{ runner.temp }}/s6-correct/result/session6_evidence_45_corrected.csv
            ${{ runner.temp }}/s6-correct/result/session6_corrected_report.md
          retention-days: 30
          if-no-files-found: warn
