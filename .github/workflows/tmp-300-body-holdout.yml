name: Temporary 300 body holdout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-300-body-holdout.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install trafilatura requests
      - name: Scan 300 recent article bodies
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin data
          git show FETCH_HEAD:canonical.sqlite3 > /tmp/canonical.sqlite3
          python - <<'PY'
          import json,re,sqlite3,requests,concurrent.futures,collections
          from pathlib import Path
          import trafilatura
          db=sqlite3.connect('/tmp/canonical.sqlite3'); db.row_factory=sqlite3.Row
          rows=[dict(r) for r in db.execute(
              "select id,source,title,snippet,url,published_at,collected_at from radar_items "
              "where status='active' order by coalesce(published_at,collected_at) desc,id desc limit 300")]
          P={
            'DEMAND': re.compile(r"\b(?:demand (?:is |will |expected to |projected to |continues to )?(?:grow|increase|rise|rising|surge|double|outpace|accelerat)|demand growth|demand is accelerating|demand accelerating|record orders?|orders? (?:surged|jumped|increased)|fully (?:booked|allocated)|capacity booked)\b",re.I),
            'CONSTRAINT': re.compile(r"\b(?:supply[- ]chain bottlenecks?|manufacturing throughput limits?|capacity constraints?|capacity constrained|constrained capacity|unable to meet demand|cannot meet demand|demand exceeds supply|single[- ]source|sole supplier|only (?:one|two|three) (?:qualified )?suppliers?|limited (?:number of )?(?:qualified )?suppliers?|long lead times?|lead times? (?:of|have|has|rose|increased|extended)|order books? (?:are )?(?:backlogged|booked)|backlogged? (?:for )?(?:years?|months?)|qualification takes?|certification takes?|shortage of (?!skilled|workers?|contractors?|crews?|staff|labor|labour))\b",re.I),
            'RELIEF': re.compile(r"\b(?:capacity expansion|expand(?:ing|ed)? capacity|new (?:plant|production line|fab|factory|mill|facility)|second source|new supplier|ramp(?:ing)? up production|commercial production|capacity (?:online|coming online)|commissioning)\b",re.I),
            'TIMING': re.compile(r"\b(?:not (?:expected|available|online) until|expected (?:by|in)|scheduled (?:for|to)|by 20(?:2[7-9]|3\d)|in 20(?:2[7-9]|3\d)|through 20(?:2[7-9]|3\d)|multi[- ]year lead time|\d{1,2}[- ]month lead time|years? out)\b",re.I),
          }
          labor=re.compile(r"\b(?:skilled workers?|contractors?|crews?|staff|labor|labour|electricians?|tradespeople|workforce)\b",re.I)
          tech=re.compile(r"\b(?:PCIe|software bottleneck|memory[- ]related bottleneck|data transfer bottleneck|network bottleneck|latency bottleneck)\b",re.I)
          headers={'User-Agent':'Mozilla/5.0 (BCT research body holdout)'}
          def one(r):
              rec={k:r.get(k) for k in ('id','source','title','url','published_at')}
              try:
                  resp=requests.get(r['url'],headers=headers,timeout=12,allow_redirects=True)
                  txt=trafilatura.extract(resp.text,include_comments=False,include_tables=False,favor_precision=True) or ''
                  ok=resp.status_code<400 and len(txt)>=300
                  rec.update(body_ok=ok,http_status=resp.status_code,body_chars=len(txt))
                  if not ok: rec['reason']='BODY_UNAVAILABLE'; return rec
                  matches={k:list(p.finditer(txt)) for k,p in P.items()}
                  hits={k:len(v) for k,v in matches.items()}
                  has_supply=bool(matches['CONSTRAINT'])
                  future=bool(has_supply and (matches['DEMAND'] or matches['TIMING'] or matches['RELIEF']))
                  # reject common non-structural false positives
                  if future and labor.search(txt) and not re.search(r"\b(?:supplier|supply chain|manufacturing throughput|capacity constrained|lead time|order books?|backlogged)\b",txt,re.I):
                      future=False
                  if future and tech.search(txt) and not re.search(r"\b(?:supplier|supply chain|manufacturing throughput|capacity constrained|lead time|order books?|backlogged)\b",txt,re.I):
                      future=False
                  windows=[]
                  for group,ms in matches.items():
                      for m in ms[:2]:
                          a=max(0,m.start()-180); b=min(len(txt),m.end()+320)
                          windows.append({'group':group,'text':' '.join(txt[a:b].split())[:650]})
                  rec.update(hits=hits,future_candidate=future,windows=windows[:8])
              except Exception as e:
                  rec.update(body_ok=False,reason=type(e).__name__+': '+str(e)[:160])
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              out=list(ex.map(one,rows))
          failures=collections.Counter(r['source'] for r in out if not r.get('body_ok'))
          candidates=[r for r in out if r.get('future_candidate')]
          result={'tested':len(out),'body_ok':sum(r.get('body_ok',False) for r in out),
                  'body_failed':sum(not r.get('body_ok',False) for r in out),
                  'future_candidates':len(candidates),'failed_domains':dict(failures.most_common()),
                  'candidates':candidates}
          Path('body-holdout-300.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k!='candidates'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: body-holdout-300
          path: body-holdout-300.json
          if-no-files-found: error
