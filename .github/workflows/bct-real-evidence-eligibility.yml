name: BCT RSS source evidence eligibility audit exact current input
on:
  push:
    branches: [ops/bct-eligible-original-evidence-20261114]
    paths: ['.github/workflows/bct-real-evidence-eligibility.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact real sidecar and count qualified original-source facts
        shell: bash
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          python -m pip install -e .
          python .github/scripts/bct_eligible_original_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-original-eligibility-audit-20261114
          path: ${{ runner.temp }}/bct-eligibility.json
          retention-days: 7
          if-no-files-found: warn
