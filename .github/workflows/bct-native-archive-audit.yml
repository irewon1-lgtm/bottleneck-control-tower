name: BCT original native failure archive audit
on:
  push:
    branches: [ops/bct-native-archive-audit-20261013]
    paths: [.github/scripts/bct_native_archive_audit.py, .github/workflows/bct-native-archive-audit.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify exact archived ERROR and actual continuation without production writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/bct_native_archive_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-native-archive-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/native-archive-receipt.json
          retention-days: 30
          if-no-files-found: error
