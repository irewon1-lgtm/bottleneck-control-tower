name: BCT Session 4 independent AI reference accuracy (200 historical)
on:
  push:
    branches: [research/bct-session4-ai-reference-eval-20261113]
    paths: [.github/workflows/bct-session4-reference-eval.yml, tools/bct_session4_reference_eval.py, tests/test_bct_session4_reference_eval.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bct-session4-reference-evaluation
  cancel-in-progress: false
jobs:
  evaluate-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      INPUT_RUN: 43334200876
      INPUT_ARTIFACT_ID: 13996133047
      INPUT_GIT_SHA: cdb8d346df246c83b96447d8c073b8b05b2bf313
      INPUT_ARTIFACT_DIGEST: sha256:1fe0a9e96e1c180e382e309e8746780a467d2cdc1a981a14c79e6fc43f59909a
    steps:
      - name: Checkout pre-existing frozen AI references and evaluator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit safety checks for unknown labels, overlap and mismatched original
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_bct_session4_reference_eval.py
      - name: Bind to exact completed session 3 run and artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN" |
            jq -e --arg sha "$INPUT_GIT_SHA" \
              '.name == "BCT Session 3 all-RSS firstpass (read-only, free CPU)" and .status=="completed" and .conclusion=="success" and .head_sha==$sha and .head_branch=="research/bct-session3-10510-firstpass-20261113"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN/artifacts?per_page=100" |
            jq -e --argjson id "$INPUT_ARTIFACT_ID" --arg digest "$INPUT_ARTIFACT_DIGEST" --argjson run "$INPUT_RUN" \
              '[.artifacts[] | select(.id==$id and .name=="bct-session3-firstpass-10510" and .digest==$digest and .expired==false and .workflow_run.id==$run)] | length == 1' >/dev/null
          mkdir -p "$RUNNER_TEMP/bct-session4/input"
          gh run download "$INPUT_RUN" --name bct-session3-firstpass-10510 \
             --dir "$RUNNER_TEMP/bct-session4/input"
          test -s "$RUNNER_TEMP/bct-session4/input/article_firstpass.csv"
          test -s "$RUNNER_TEMP/bct-session4/input/firstpass_summary.json"
          sha256sum "$RUNNER_TEMP/bct-session4/input/article_firstpass.csv" \
                   "$RUNNER_TEMP/bct-session4/input/firstpass_summary.json"
      - name: Compare independently frozen AI references to existing CPU predictions
        run: |
          set -euo pipefail
          python tools/bct_session4_reference_eval.py \
            --article-ledger "$RUNNER_TEMP/bct-session4/input/article_firstpass.csv" \
            --session3-summary "$RUNNER_TEMP/bct-session4/input/firstpass_summary.json" \
            --output "$RUNNER_TEMP/bct-session4/results"
          test -s "$RUNNER_TEMP/bct-session4/results/evaluation_summary.json"
          test -s "$RUNNER_TEMP/bct-session4/results/metadata_errors.csv"
          test -s "$RUNNER_TEMP/bct-session4/results/blind_reference_packet_240.csv"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bct-session4/results"
          r=json.loads((root/"evaluation_summary.json").read_text())
          assert r["aggregate"]["matched"]==200, "Do not publish inaccurate 200-document benchmark"
          assert r["new_blind_packet"]["size"]==240
          assert r["new_blind_packet"]["historical_200_overlap"]==0
          assert r["source_web_requests"]==r["AI_provider_calls"]==r["source_db_writes"]==0
          print("BCT_SESSION4_EVALUATION_VERIFIED=200")
          PY
      - name: Display actual result and explicit limitations
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/bct-session4/results/session4_report.md"; then
            cat "$RUNNER_TEMP/bct-session4/results/session4_report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "EVALUATION_INCOMPLETE: Never infer precision/recall from a failed run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-session4-ai-reference-eval-200-and-blind240
          path: |
            ${{ runner.temp }}/bct-session4/results/evaluation_summary.json
            ${{ runner.temp }}/bct-session4/results/metadata_errors.csv
            ${{ runner.temp }}/bct-session4/results/blind_reference_packet_240.csv
            ${{ runner.temp }}/bct-session4/results/blind_sample_provenance.json
            ${{ runner.temp }}/bct-session4/results/session4_report.md
          if-no-files-found: warn
          retention-days: 30
