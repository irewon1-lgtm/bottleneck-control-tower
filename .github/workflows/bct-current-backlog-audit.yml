name: BCT live 10604 RSS source backlog reconciliation
on:
  push:
    branches: [ops/bct-backlog-source-reconcile-20261113]
    paths: ['.github/workflows/bct-current-backlog-audit.yml']
permissions:
  contents: read
jobs:
  immutable-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing no-network-article processing and regression packages
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_bct_session7_queue_monitor.py tests/test_bct_session7_select_work.py
      - name: Pin current canonical and source sidecar without writing either
        shell: bash
        run: |
          set -euo pipefail
          data=$(git ls-remote origin refs/heads/data | cut -f1)
          side=$(git ls-remote origin refs/heads/future-bottleneck-data | cut -f1)
          [[ "$data" =~ ^[0-9a-f]{40}$ && "$side" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$data"
          git fetch --no-tags --depth=1 origin "$side"
          echo "BCT_DATA_PIN=$data" >> "$GITHUB_ENV"
          echo "BCT_SIDECAR_PIN=$side" >> "$GITHUB_ENV"
          echo "RSS_DATA_SHA=$data"
          echo "PREVIOUS_EVIDENCE_SIDECAR_SHA=$side"
      - name: Reconcile every RSS article with source/full/partial/hold and fair due work
        shell: bash
        run: |
          set -euo pipefail
          python tools/bct_session7_queue_monitor.py \
            --data-sha "$BCT_DATA_PIN" --sidecar-sha "$BCT_SIDECAR_PIN" \
            --budget 120 --output "$RUNNER_TEMP/bct-current-ledger"
          python - <<'PY'
          import json,os,csv
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'bct-current-ledger'
          r=json.loads((path/'queue_health.json').read_text())
          with (path/'articles_ledger.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          with (path/'bounded_work_plan.csv').open(encoding='utf-8-sig',newline='') as f: work=list(csv.DictReader(f))
          assert r['status']=='PASS_READ_ONLY_QUEUE_RECONCILIATION'
          assert r['articles']==len(rows)>=10604
          assert r['sidecar_attached_articles']+r['articles_without_sidecar']==len(rows)
          assert sum(r['body_counts'].values())==len(rows)
          assert sum(r['work_actions'].values())==len(rows)
          assert len(work)==r['selected_work_count']<=120
          assert len({x['article_id'] for x in work})==len(work)
          assert r['new_full_article_downloads']==0 and r['candidate_promotions']==0
          public={k:r[k] for k in ('articles','prior_sidecar_results','articles_without_sidecar',
                    'body_counts','work_actions','review_lanes','selected_work_count',
                    'selected_recent','selected_older','waiting_fetch_or_recheck',
                    'blocked_or_deferred','canonical_data_sha','sidecar_sha','sidecar_shards_hash_verified')}
          (path/'progress.json').write_text(json.dumps(public,ensure_ascii=False,indent=2))
          print('BCT_LIVE_BACKLOG_AUDIT='+json.dumps(public,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-current-immutable-backlog-audit
          path: |
            ${{ runner.temp }}/bct-current-ledger/progress.json
            ${{ runner.temp }}/bct-current-ledger/queue_readme_ko.md
            ${{ runner.temp }}/bct-current-ledger/bounded_work_plan.csv
          retention-days: 7
          if-no-files-found: warn
