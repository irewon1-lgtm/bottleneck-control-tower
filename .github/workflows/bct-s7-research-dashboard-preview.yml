name: BCT S7 source-bound dashboard preview and 6-hour refresh QA
on:
  push:
    branches: [ops/bct-s7-source-bound-dashboard-preview-20261116, main]
    paths:
      - docs/index.html
      - docs/app.js
      - docs/s7-research-view.js
      - tools/bct_s7_source_truth_preview.py
      - tests/test_bct_s7_source_truth_preview.py
      - tests/test_bct_s7_source_truth.js
      - tests/test_future_pages_v33.js
      - .github/workflows/bct-s7-research-dashboard-preview.yml
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: bct-s7-source-truth-preview-per-generation
  cancel-in-progress: false
jobs:
  immutable-source-status-and-preview:
    if: ${{ github.repository == 'irewon1-lgtm/bottleneck-control-tower' && (github.event_name != 'push' || github.ref == 'refs/heads/ops/bct-s7-source-bound-dashboard-preview-20261116' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tools
      GH_TOKEN: ${{ github.token }}
      RESEARCH_BRANCH: research/bct-s6-sourcefree-ledger-20261116
      RESEARCH_FOLDER: research/bct-v4/s6-316-60-20261116
      PAGES_PROOF_RUN: '43847161947'
      PAGES_PROOF_ARTIFACT: '14215199098'
      PAGES_PROOF_HEAD: '56db0da53f83cb76129cf29b22049e3593087269'
      PAGES_PROOF_DIGEST: 'sha256:2863a94473868f74b0cef0cb78e915b0c84eff3611a2cb320f6960abbf22b83d'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test immutable provenance contracts and real dashboard route
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_bct_s7_source_truth_preview.py -v
          node --test tests/test_bct_s7_source_truth.js tests/test_future_pages_v33.js
          node --check docs/app.js
          node --check docs/s7-research-view.js
      - name: Authenticate exact previously published historical 511 QA receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_PROOF_RUN" > "$RUNNER_TEMP/pages-proof-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_PROOF_ARTIFACT" > "$RUNNER_TEMP/pages-proof-artifact.json"
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])
          r=json.loads((d/'pages-proof-run.json').read_text())
          a=json.loads((d/'pages-proof-artifact.json').read_text())
          assert r['id']==int(os.environ['PAGES_PROOF_RUN'])
          assert r['name']=='BCT S6 verify actual deployed Pages historical 511 versus 1703 detail files'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']==os.environ['PAGES_PROOF_HEAD']
          assert a['id']==int(os.environ['PAGES_PROOF_ARTIFACT'])
          assert a['name']=='bct-s6-published-511-source-free-'+os.environ['PAGES_PROOF_RUN']
          assert a['workflow_run']['id']==r['id'] and not a['expired']
          assert a['digest']==os.environ['PAGES_PROOF_DIGEST']
          print('BCT_S7_HISTORICAL_PAGES_511_SOURCE_PROVENANCE_PASS')
          PY
          mkdir -p "$RUNNER_TEMP/pages-proof"
          gh run download "$PAGES_PROOF_RUN" -R "$GITHUB_REPOSITORY" \
            --name "bct-s6-published-511-source-free-$PAGES_PROOF_RUN" \
            --dir "$RUNNER_TEMP/pages-proof"
          python tools/bct_s6_pages_511_audit.py \
            --verify-only --out "$RUNNER_TEMP/pages-proof"
      - name: Pin and read actual durable research branch SQLite and operating ref HEADs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RESEARCH_BRANCH"
          RESEARCH_SHA=$(git rev-parse FETCH_HEAD)
          DATA_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/data" --jq '.object.sha')
          SIDE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/future-bottleneck-data" --jq '.object.sha')
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          export RESEARCH_SHA DATA_SHA SIDE_SHA MAIN_SHA
          mkdir -p "$RUNNER_TEMP/s7-research"
          git show "$RESEARCH_SHA:$RESEARCH_FOLDER/research-sourcefree.sqlite3" \
            > "$RUNNER_TEMP/s7-research/research-sourcefree.sqlite3"
          git show "$RESEARCH_SHA:$RESEARCH_FOLDER/research-summary.json" \
            > "$RUNNER_TEMP/s7-research/research-summary.json"
          python tools/bct_s6_durable_sourcefree_research.py \
            --verify-only --out "$RUNNER_TEMP/s7-research"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RESEARCH_BRANCH" --jq '.object.sha')" = "$RESEARCH_SHA"
          echo "RESEARCH_SHA=$RESEARCH_SHA" >> "$GITHUB_ENV"
          echo "DATA_SHA=$DATA_SHA" >> "$GITHUB_ENV"
          echo "SIDE_SHA=$SIDE_SHA" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "BCT_S7_DURABLE_RESEARCH_COMMIT_AND_SQLITE_ATTESTED"
      - name: Build S7 source-truth status directly from two independently re-queried SQLites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s7-preview"
          python tools/bct_s7_source_truth_preview.py \
            --research "$RUNNER_TEMP/s7-research" \
            --pages-proof "$RUNNER_TEMP/pages-proof" \
            --research-sha "$RESEARCH_SHA" \
            --main-sha "$MAIN_SHA" \
            --sidecar-sha "$SIDE_SHA" \
            --data-sha "$DATA_SHA" \
            --out "$RUNNER_TEMP/s7-preview/s7-research-status.json"
          for source in index.html style.css app.js view-model.js s7-research-view.js; do
            cp "docs/$source" "$RUNNER_TEMP/s7-preview/$source"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RESEARCH_BRANCH" --jq '.object.sha')" = "$RESEARCH_SHA"
          node --check "$RUNNER_TEMP/s7-preview/app.js"
          node --check "$RUNNER_TEMP/s7-preview/s7-research-view.js"
          node - <<'JS'
          "use strict";
          const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict");
          const root=path.join(process.env.RUNNER_TEMP,"s7-preview");
          const next=require(path.join(process.env.GITHUB_WORKSPACE,"docs","s7-research-view.js"))
                      .validate(JSON.parse(fs.readFileSync(path.join(root,"s7-research-status.json"),"utf8")));
          assert.equal(next.historical.record_count,511);
          assert.equal(next.research.strict_original_publisher_body_date_verified,18);
          assert.equal(next.research.new_sourcebound_research_hints_not_independent_pairs,147);
          assert.equal(next.admission.eligible_independent_pair_count,0);
          assert.equal(next.deployment.public_pages_deployed_by_this_job,false);
          console.log("BCT_S7_ACTUAL_GENERATED_JSON_ACCEPTED_BY_BROWSER_VIEW_SCHEMA_PASS");
          JS
      - name: Assert browser bundle status was verified and no operating state published
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'s7-preview'
          x=json.loads((d/'s7-research-status.json').read_text())
          assert x['historical']['record_count']==511
          assert x['historical']['counts']=={'reviewed':23,'structured':211,'discovery':277}
          assert x['research']['strict_original_publisher_body_date_verified']==18
          assert x['research']['new_sourcebound_research_hints_not_independent_pairs']==147
          assert x['research']['registered_target_holds']==22
          assert x['admission']['eligible_independent_pair_count']==0
          assert x['deployment']['public_pages_deployed_by_this_job'] is False
          assert x['deployment']['LIVE_writes']==x['deployment']['public_rank_writes']==0
          assert x['deployment']['session8']=='NOT_RUN'
          content=(d/'index.html').read_text()
          assert 'data-page="research"' in content
          assert 's7-research-view.js' in content
          for name in ('app.js','s7-research-view.js','index.html'):
              assert (d/name).stat().st_size>500
          print('BCT_S7_ACTUAL_READONLY_DASHBOARD_PREVIEW='+json.dumps({
            'historical_511_at':x['historical']['data_at_utc'],
            'current_research_originals':x['research']['strict_original_publisher_body_date_verified'],
            'research_hints_NOT_ranked':x['research']['new_sourcebound_research_hints_not_independent_pairs'],
            'TARGET_HOLD':x['research']['registered_target_holds'],
            'qualified_pairs':0,'research_commit':x['research']['commit_sha'],
            'latest_source_heads_only_not_promoted':x['generations']['sidecar_commit_observed'],
            'public_pages_deployed':False
          },sort_keys=True))
          PY
      - name: Stage read-only preview and authoritative metadata only (NO Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: bct-s7-source-truth-dashboard-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s7-preview/index.html
            ${{ runner.temp }}/s7-preview/style.css
            ${{ runner.temp }}/s7-preview/app.js
            ${{ runner.temp }}/s7-preview/view-model.js
            ${{ runner.temp }}/s7-preview/s7-research-view.js
            ${{ runner.temp }}/s7-preview/s7-research-status.json
          retention-days: 30
          if-no-files-found: error
