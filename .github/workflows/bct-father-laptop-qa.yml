name: BCT 16-inch laptop visual QA
on:
  push:
    branches: [qa/bct-father-laptop-20261112]
    paths: ['.github/workflows/bct-father-laptop-qa.yml']
permissions:
  contents: read
jobs:
  chromium-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare temporary browser and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/bct-laptop-browser"
          cd "$RUNNER_TEMP/bct-laptop-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Render unchanged public research with new local HTML and CSS
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/bct-laptop-browser/node_modules" node qa/father-laptop-verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-laptop-preview-screenshots
          path: qa/preview-output/
          retention-days: 7
          if-no-files-found: warn
