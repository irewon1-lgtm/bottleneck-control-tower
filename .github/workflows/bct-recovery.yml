name: BCT recovery storage gates
on:
  push:
    branches: [ops/recovery-20261010]
  workflow_run:
    workflows: [Future bottleneck body candidates]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preserve_resume_only:
        description: Preserve authenticated input bytes only; never execute or renew Gate proof
        type: boolean
        default: false
      archive_key:
        description: Large legacy history preservation is explicit only; no evaluations expansion
        type: choice
        options: [recovery, legacy-source, rss]
        default: recovery
      resume_run_id:
        description: Prior recovery artifact run ID, after its recorded resume condition changed
        required: false
        default: ''
      full_pipeline:
        description: Execute real operating Stage 0 through FULL after guarded main release
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: bct-recovery-validation
  cancel-in-progress: false
jobs:
  preserve-input:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.preserve_resume_only) ||
           (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      ARCHIVE_KEY: ${{ inputs.archive_key || 'recovery' }}
      PRESERVE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe input and real release-proof expiry without running Gates
        id: health
        run: |
          set -euo pipefail
          requested=()
          if [[ "$PRESERVE_REQUESTED" == 'true' ]]; then requested+=(--preserve-requested); fi
          timeout 120 python .github/scripts/recovery_artifacts.py inspect \
            --key "$ARCHIVE_KEY" "${requested[@]}" --output "$RUNNER_TEMP/artifact-health.json"
      - name: Preserve only the registered opaque ZIP; no source or model execution
        if: steps.health.outputs.preservation_due == 'true'
        run: >-
          timeout 600 python .github/scripts/recovery_artifacts.py preserve
          --key "$ARCHIVE_KEY" --destination "$RUNNER_TEMP/preserved-input"
          --output "$RUNNER_TEMP/preservation-created.json"
      - uses: actions/upload-artifact@v4
        id: preserved
        if: steps.health.outputs.preservation_due == 'true'
        with:
          name: ${{ steps.health.outputs.artifact_name }}
          path: ${{ runner.temp }}/preserved-input/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Read the actual preserved recovery input back through the runner
        if: steps.health.outputs.preservation_due == 'true' && env.ARCHIVE_KEY == 'recovery'
        env:
          PRESERVED_ARTIFACT_ID: ${{ steps.preserved.outputs.artifact-id }}
        run: >-
          timeout 300 python .github/scripts/recovery_artifacts.py restore
          --key recovery --preserved-artifact-id "$PRESERVED_ARTIFACT_ID"
          --destination "$RUNNER_TEMP/preserved-resume-verification"
          --output "$RUNNER_TEMP/preservation-readback.json"
      - name: Publish bounded maintenance status; proof renewal still requires actual Gates
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); path=root/'artifact-health.json'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Input preservation and release-proof expiry\n\n')
              if path.exists():
                  value=json.loads(path.read_text())
                  summary.write('Recorded release artifact: '+str(value['recorded_release_artifact'])+'\n\n')
                  for key,entry in value['archives'].items():summary.write(key+': '+str(entry)+'\n\n')
              else:summary.write('Health observation failed; input/proof readiness is UNKNOWN.\n\n')
              summary.write('Copied input is not a new Gate proof. Renew proof only with actual current-code Gates and a truthful receipt. No operating Git ref/DB/model was changed by preservation.\n')
          PY
  storage:
    if: ${{ github.event_name != 'workflow_run' && !inputs.preserve_resume_only }}
    permissions:
      contents: write
      actions: write
    # Gate 1 and live body candidates both publish the same sidecar branch.
    # Serialize ONLY their writer jobs; RSS collection keeps its own schedule/lock.
    concurrency:
      group: future-bottleneck-results
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read preserved recovery request
        id: request
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('.github/bct-recovery-request.json')
          requested=os.environ.get('DISPATCH_RESUME_RUN') or (json.loads(p.read_text()).get('resume_run_id') if p.exists() else '')
          if requested and not str(requested).isdigit():raise ValueError('invalid recovery run ID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('resume_run_id='+str(requested or '')+'\n')
          retained=(json.loads(p.read_text()).get('retained_cache') or {}).get('run_id','') if p.exists() else ''
          if retained and not str(retained).isdigit():raise ValueError('invalid retained cache run ID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('retained_cache_run_id='+str(retained)+'\n')
          configured_full=json.loads(p.read_text()).get('full_pipeline',False) if p.exists() else False
          if type(configured_full) is not bool:raise ValueError('full_pipeline must be a boolean')
          full=os.environ.get('DISPATCH_FULL')=='true' or configured_full
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('full_pipeline='+str(full).lower()+'\n')
          PY
        env:
          DISPATCH_RESUME_RUN: ${{ inputs.resume_run_id }}
          DISPATCH_FULL: ${{ inputs.full_pipeline }}
      - name: Restore prior observations and private cache
        if: steps.request.outputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: >-
          timeout 300 python .github/scripts/recovery_artifacts.py restore
          --key recovery --destination "$RUNNER_TEMP/bct-recovery-resume"
          --output "$RUNNER_TEMP/recovery-input-transport.json"
      - name: Restore historical cache hashes absent from latest checkpoint
        if: steps.request.outputs.retained_cache_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: bct-recovery-checkpoint-${{ steps.request.outputs.retained_cache_run_id }}
          run-id: ${{ steps.request.outputs.retained_cache_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bct-recovery-retained-cache
      - name: Verify storage, preserving merge and legacy regressions
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_future_github.py tests/test_future_github_shards.py tests/test_future_github_atomic.py tests/test_future_store.py
      - name: Verify restored checkpoint journal and every source cache hash
        if: steps.request.outputs.resume_run_id != ''
        env:
          BCT_RESUME_RUN: ${{ steps.request.outputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from bct.recovery_restore import verify_restored,copy_preserved_caches,copy_latest_root_state
          request=json.loads(Path('.github/bct-recovery-request.json').read_text())
          if str(request['resume_run_id'])!=os.environ['BCT_RESUME_RUN']:raise ValueError('unverified resume run selected')
          root=Path(os.environ['RUNNER_TEMP'])/'bct-recovery-resume'
          if not request.get('resume_cache_inventory_sha256'):raise ValueError('pinned source cache inventory required')
          receipt=verify_restored(root,request.get('resume_file_sha256',{}),expected_cache_inventory=request['resume_cache_inventory_sha256'])
          if str(json.loads((root/'checkpoint.json').read_text())['run_id'])!=os.environ['BCT_RESUME_RUN']:raise ValueError('restored run ID differs')
          output=Path(os.environ['RUNNER_TEMP'])/'bct-recovery'
          output.mkdir(exist_ok=True)
          (output/'restore-verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          copy_preserved_caches(root,output)
          retained=request.get('retained_cache')
          if retained:
              old=Path(os.environ['RUNNER_TEMP'])/'bct-recovery-retained-cache'
              if str(json.loads((old/'checkpoint.json').read_text())['run_id'])!=str(retained['run_id']):raise ValueError('retained cache run ID differs')
              proof=verify_restored(old,retained['file_sha256'],expected_cache_inventory=retained['inventory_sha256'])
              proof['union']=copy_preserved_caches(old,output)
              (output/'retained-cache-verification.json').write_text(json.dumps(proof,indent=2)+'\n')
          # Preserve latest root journals before any later gate can replace
          # them. Historical cache unioning above never owns these files.
          import shutil
          copy_latest_root_state(root,output)
          if (root/'private-source-html').exists():shutil.copytree(root/'private-source-html',output/'private-source-html',dirs_exist_ok=True)
          # Keep the exact compact corpus even if a later Gate fails before
          # its required restore step. This is authenticated input only.
          import sys
          sys.path.insert(0,'.github/scripts')
          from recovery_artifacts import carry_compact
          print(carry_compact(root/'fixed-precursor-qa',output/'fixed-precursor-qa'))
          PY
      - name: Gate 0 then real GitHub storage Gate 1
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/bct_storage_recovery.py
      - name: Gate 2 original source access on GitHub runner
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/bct_source_audit.py
      - name: Gate 3 full failed-source inventory
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/bct_full_source_recovery.py
      - name: Gate 4 official original verification and evidence holds
        if: steps.request.outputs.full_pipeline != 'true'
        run: python .github/scripts/bct_evidence_recovery.py
      - name: Stage 5 cost-zero real-source reading pilot
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BCT_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        run: python .github/scripts/bct_local_reader_probe.py
      - name: Gate 5 actual readings and atomic production queue recovery
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/bct_queue_recovery.py
      - name: Check out reviewed immutable fixed230 input helpers
        uses: actions/checkout@v4
        with:
          ref: 7d9188608a66520115727ff5daa30d13190f4958
          path: .bct-fixed230-input
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/receive_cpu_sources.py
            /.github/scripts/copy_fixed230.py
      - name: Restore original 230-source regression corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bct-recovery"
          validate_compact_copy() {
          python - "$1" <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); current=root/'bct-fixed230-copy-current.json'; report=json.loads(current.read_text())
          expected={'status':'PASS_EXACT_FIXED230_LITERAL_COPY','source_input_sha256':'acd344732f2f087b42767bfe32d9f16d96da6de49a766d6fc73f3c0ed298f9ec',
                    'documents':230,'body_hashes_verified':230,'raw_hashes_verified':230,'copied_files':460,'copied_bytes':41784646,
                    'copied_file_hash_map_sha256':'a489b7f008fa80bf3729d1563a29c7e60effd4da011ba9fa54abed010689e566'}
          if any(report.get(k)!=v for k,v in expected.items()):raise ValueError('FIXED230_COMPACT_GOLDEN_FILE_MAP_BINDING')
          current.replace(root/'bct-recovery/fixed230-copy.json')
          if sys.argv[1]=='resume':
              checkpoint=json.loads((root/'bct-recovery-resume/checkpoint.json').read_text())
              proof={'status':'PASS_AUTHENTICATED_COMPACT_FIXED230_INPUT','resume_run_id':checkpoint['run_id'],
                     'resume_code_sha':checkpoint['code_sha'],'corpus':expected,'legacy_archive_downloads':0,
                     'source_HTTP_requests':0,'new_gate_execution':False,'release_proof_renewed':False}
              (root/'bct-recovery/fixed230-input-transport.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
          }
          if [[ -d "$RUNNER_TEMP/bct-recovery-resume/fixed-precursor-qa" ]]; then
            cache="$RUNNER_TEMP/bct-recovery-resume/fixed-precursor-qa"
            destination="$RUNNER_TEMP/bct-recovery/fixed-precursor-qa"
            # The early carry keeps bytes through failures. Recheck that
            # carried directory with the immutable native/body verifier now.
            if [[ -d "$destination" ]]; then cache="$destination"; destination="$RUNNER_TEMP/bct-fixed230-recheck"; fi
            timeout 60 python .bct-fixed230-input/.github/scripts/copy_fixed230.py \
              --cache "$cache" --destination "$destination" --receipt "$RUNNER_TEMP/bct-fixed230-copy-current.json"
            validate_compact_copy resume
            exit 0
          fi
          timeout 120 gh api repos/irewon1-lgtm/bottleneck-control-tower/actions/runs/42939818925/artifacts?per_page=100 > "$RUNNER_TEMP/bct-fixed230-source-artifacts.json"
          timeout 120 gh api repos/irewon1-lgtm/bottleneck-control-tower/actions/runs/42939431146/artifacts?per_page=100 > "$RUNNER_TEMP/bct-fixed230-rss-artifacts.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          approved=[('source','precursor-private-cache',13821760877,4598165007,'sha256:949e95d2efda7a3fd3e7a124eb0d6569b56b54dcd1a3d5fd7f053dc75b8dfb72'),
                    ('rss','rss-live-result',13820246103,527551,'sha256:006124e204a8315e68e9a8abbd39cbca8eacc523e09d89318fbe1d830e2f403a')]
          for kind,name,identity,size,digest in approved:
              matches=[a for a in json.loads((root/('bct-fixed230-'+kind+'-artifacts.json')).read_text())['artifacts'] if a.get('name')==name]
              if len(matches)!=1 or any(matches[0].get(k)!=v for k,v in {'id':identity,'size_in_bytes':size,'digest':digest,'expired':False}.items()):
                  raise ValueError('FIXED230_APPROVED_ARTIFACT_BINDING')
          PY
          timeout 120 gh run download 42939431146 --name rss-live-result --dir "$RUNNER_TEMP/bct-fixed230-rss"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'bct-fixed230-rss/new-document-manifest.json'
          if hashlib.sha256(source.read_bytes()).hexdigest()!='65aa1e71528bc0b2e156ba83ad4ff7d76ecf3c30536a1ffb0b72601f2abe0446':
              raise ValueError('FIXED230_APPROVED_RSS_MANIFEST_BINDING')
          PY
          timeout 300 python .bct-fixed230-input/.github/scripts/receive_cpu_sources.py \
            --run-id 42939818925 --expected-head 28d0b8c648c0218ab2e74a1fa04ca8d63e659933 \
            --rss-run-id 42939431146 --rss-manifest "$RUNNER_TEMP/bct-fixed230-rss/new-document-manifest.json" \
            --destination "$RUNNER_TEMP/bct-fixed230-source" --receipt "$RUNNER_TEMP/bct-recovery/fixed230-input-transport.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          proof=json.loads((Path(os.environ['RUNNER_TEMP'])/'bct-recovery/fixed230-input-transport.json').read_text())
          if (proof.get('status')!='PASS_BOUNDED_CPU_INPUT_TRANSPORT' or proof.get('artifact_id')!=13821760877
                  or proof.get('artifact_digest')!='sha256:949e95d2efda7a3fd3e7a124eb0d6569b56b54dcd1a3d5fd7f053dc75b8dfb72'):
              raise ValueError('FIXED230_APPROVED_SOURCE_RECEIPT_BINDING')
          PY
          timeout 60 python .bct-fixed230-input/.github/scripts/copy_fixed230.py \
            --cache "$RUNNER_TEMP/bct-fixed230-source" --destination "$RUNNER_TEMP/bct-recovery/fixed-precursor-qa" \
            --receipt "$RUNNER_TEMP/bct-fixed230-copy-current.json"
          validate_compact_copy cold
      - name: Gate 6 real source E2E and required whole regressions
        if: steps.request.outputs.full_pipeline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install ruff mypy build
          python .github/scripts/bct_e2e_recovery.py
      - name: Install actual browser and operating quality dependencies
        if: steps.request.outputs.full_pipeline == 'true'
        run: |
          python -m pip install ruff mypy build
          npm install --prefix "$RUNNER_TEMP/bct-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/bct-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Execute actual Stage 0 through FULL recovery engine
        if: steps.request.outputs.full_pipeline == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BCT_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
          BCT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/bct-browser/node_modules/playwright
        run: python .github/scripts/bct_operating_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-recovery-checkpoint-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bct-recovery/checkpoint.json
            ${{ runner.temp }}/bct-recovery/operating-*.json
            ${{ runner.temp }}/bct-recovery/operating-*.png
            ${{ runner.temp }}/bct-recovery/restore-verification.json
            ${{ runner.temp }}/bct-recovery/retained-cache-verification.json
            ${{ runner.temp }}/bct-recovery/recovery-preservation-seal.json
            ${{ runner.temp }}/bct-recovery/e2e-*.json
            ${{ runner.temp }}/bct-recovery/e2e-*.xml
            ${{ runner.temp }}/bct-recovery/e2e-original-230/operating-report.json
            ${{ runner.temp }}/bct-recovery/fixed230-input-transport.json
            ${{ runner.temp }}/bct-recovery/fixed230-copy.json
            ${{ runner.temp }}/bct-recovery/fixed-precursor-qa/documents/*.json
            ${{ runner.temp }}/bct-recovery/fixed-precursor-qa/raw/*
            ${{ runner.temp }}/bct-recovery/*.log
            ${{ runner.temp }}/bct-recovery/source-audit.json
            ${{ runner.temp }}/bct-recovery/source-recovery-*.json*
            ${{ runner.temp }}/bct-recovery/private-source-cache/*.txt
            ${{ runner.temp }}/bct-recovery/private-source-html/*.html
            ${{ runner.temp }}/bct-recovery/evidence-recovery-*.json
            ${{ runner.temp }}/bct-recovery/private-evidence-raw/*.bin
            ${{ runner.temp }}/bct-recovery/private-evidence-cache/*.txt
            ${{ runner.temp }}/bct-recovery/private-evidence-search/*.xml
            ${{ runner.temp }}/bct-recovery/local-reader-*.json
            ${{ runner.temp }}/bct-recovery/local-reader-*.log
            ${{ runner.temp }}/bct-recovery/queue-recovery-*.json
            ${{ runner.temp }}/bct-recovery/private-local-reader-execution.jsonl
            ${{ runner.temp }}/bct-recovery/native-claim-recovery.json
            ${{ runner.temp }}/bct-recovery/native-claim-history.json
            ${{ runner.temp }}/bct-recovery/private-native-claim/**/*
          if-no-files-found: error
          retention-days: 30
      - name: Dispatch strict actual Gate attestation after successful checkpoint upload
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.request.outputs.full_pipeline != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          # A dispatch is only a request, never approval. The separate
          # finalizer waits for the completed current-code Gate and validates
          # every Gate step, artifact, source cache and atomic receipt commit.
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          request={'ref':'main','inputs':{'gate_run_id':os.environ['GITHUB_RUN_ID']}}
          Path(os.environ['RUNNER_TEMP'],'gate-attestor-dispatch.json').write_text(json.dumps(request))
          PY
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/bct-gate-renewal-20261112.yml/dispatches" \
            --input "$RUNNER_TEMP/gate-attestor-dispatch.json" >/dev/null
          echo 'Actual Gate finalizer dispatched after checkpoint upload; no Gate PASS asserted.'
