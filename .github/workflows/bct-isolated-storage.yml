name: BCT isolated storage and source validation
on:
  push:
    branches: [fix/bct-storage-linked-verification-20261012]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: bct-isolated-storage-validation
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Python and JavaScript regression
        run: |
          python -m pytest -q
          node --test tests/*.js
      - uses: actions/download-artifact@v4
        with:
          name: precursor-private-cache
          run-id: 37790294699
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bct-fixed-230
      - name: Original 230 source regression
        run: >-
          python tools/precursor_operating_qa.py
          --cache "${{ runner.temp }}/bct-fixed-230"
          --output "${{ runner.temp }}/bct-isolated-storage/source-230.json"
      - name: Real GitHub storage CAS history and isolated rollback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/bct_isolated_storage_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-isolated-storage-${{ github.run_id }}
          path: ${{ runner.temp }}/bct-isolated-storage/
          retention-days: 30
          if-no-files-found: error
