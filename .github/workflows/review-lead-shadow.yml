name: REVIEW_LEAD SHADOW intake
on:
  workflow_run:
    workflows: [New precursor evidence acquisition, V4 CPU private research consumer]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: review-lead-shadow-state
  cancel-in-progress: false
jobs:
  shadow:
    if: >-
      ${{ vars.BCT_REVIEW_SHADOW_ENABLED == 'true' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream source run may predate this receiver. Run reviewed
          # receiver code from the immutable workflow commit instead.
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Receive the existing saved-source artifact, not LIVE state
        if: github.event.workflow_run.name == 'New precursor evidence acquisition'
        env:
          GH_TOKEN: ${{ github.token }}
          ACQUISITION_RUN_ID: ${{ github.event.workflow_run.id }}
          ACQUISITION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          ACQUISITION_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p var/review-handoff var/review-state
          # Failed acquisition can still contain verified captures. Match the
          # exact attempt and archive digest before the unchanged body loader.
          python .github/scripts/receive_review_inputs.py source \
            --run-id "$ACQUISITION_RUN_ID" --attempt "$ACQUISITION_ATTEMPT" --head "$ACQUISITION_HEAD"
      - name: Restore only the dedicated review state branch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p var/review-state
          review_sha=$(git ls-remote origin refs/heads/review-lead-shadow-state | cut -f1)
          echo "BASE_REVIEW_SHA=$review_sha" >> "$GITHUB_ENV"
          if [[ -n "$review_sha" ]]; then
            git fetch --no-tags origin review-lead-shadow-state
            test "$(git rev-parse FETCH_HEAD)" = "$review_sha"
            git ls-tree -r "$review_sha" > var/review-state-tree.txt
            python - <<'PYTHON'
          from pathlib import Path
          for line in Path('var/review-state-tree.txt').read_text().splitlines():
              header, name = line.split('\t', 1)
              assert header.split()[:2] == ['100644', 'blob'], 'review tree symlink/submodule forbidden'
              assert name.startswith('review-lead-shadow/') and '..' not in name.split('/'), 'foreign review path'
          PYTHON
            git archive "$review_sha" | tar -x -C var/review-state
          fi
      - name: Apply frozen REVIEW_LEAD intake in SHADOW
        if: env.BCT_REVIEW_HANDOFF_AVAILABLE == 'true'
        run: >-
          python .github/scripts/review_shadow_frozen.py
          --input var/review-handoff/input.json
          --state var/review-state/review-lead-shadow
      - name: Checkout the immutable source-free CPU receipt reader
        if: always()
        uses: actions/checkout@v4
        with:
          # Final reviewed processor pin is filled after the core freeze.
          ref: '58817b1fed0791e2a4ac591b1e684cab8e7f3b61'
          path: processor
          persist-credentials: false
      - name: Catch up ACK-bound public read evidence on every REVIEW event
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: processor/src
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python .github/scripts/receive_review_inputs.py public --run-id "$UPSTREAM_RUN_ID" --processor-root processor
          if [[ -f var/review-state/review-lead-shadow/shadow-activation.json ]]; then
            shopt -s nullglob
            for snapshot in var/review-public-inputs/*.json; do
              python -m bct.v4.review_cpu_receipts --snapshot "$snapshot" --state var/review-state/review-lead-shadow
            done
          else
            echo 'REVIEW CPU pointer pending: the separate frozen REVIEW state is not initialized.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve append-only review state in its own branch
        if: always()
        run: python .github/scripts/persist_review_shadow.py
      - name: Preserve audit and important updates
        # An upstream failure without any source cache has no audit bytes to
        # upload. Avoid copying the same historical shadow store repeatedly.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-lead-shadow-audit-${{ github.run_attempt }}
          path: var/review-state/review-lead-shadow/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Publish only important review updates to run summary
        if: always()
        run: |
          if [[ -f var/review-state/review-lead-shadow/summary.md ]]; then
            cat var/review-state/review-lead-shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
