# Runtime remains OFF unless BOTH existing Variables match the reviewed code and enabled=true.
# Source-separated private seed and recovery have passed; never repeat connection probes.
# Replace the old public write-token proposal; no public contents:write, no raw artifacts/cache.
# Existing main-scoped runtime cache is mandatory. No install/download fallback.
name: V4 CPU private research consumer
on:
  workflow_run:
    workflows: [New precursor evidence acquisition]
    types: [completed]
  workflow_dispatch:
    inputs:
      purpose:
        type: choice
        options: [seed, recovery-check, bridge-recover, q1-transfer-key, q1-publish, q1-connectivity, q1-source-batch, q1-trade-resume, q1-storage-check, q1-quality-Q2, q1-recover-result, q2-review, q2-counterpart, q2-relations, archive-storage-trial, monthly-storage-trial]
        default: seed
      q1_key_run:
        type: string
        default: ''
      q1_blob_sha:
        type: string
        default: ''
      q1_packet_sha:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-cpu-private-research-single-writer
  cancel-in-progress: false
env:
  PYTHONPATH: src
  CPU_CODE_SHA: 221fa92b1cbff8950716ec373eac793ca340c873
  EXPECTED_CPU_CODE_SHA: 221fa92b1cbff8950716ec373eac793ca340c873
jobs:
  monthly-storage-trial:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && inputs.purpose == 'monthly-storage-trial' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate actual monthly research save, resume and restore without scheduled activation
        env:
          GH_TOKEN: ${{ github.token }}
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: |
          timeout 120 python -u tools/v4_monthly_storage_trial.py prepare
          timeout 120 python -u tools/v4_monthly_storage_trial.py seed
          timeout 120 python -u tools/v4_monthly_storage_trial.py append
          timeout 120 python -u tools/v4_monthly_storage_trial.py interrupt
          timeout 120 python -u tools/v4_monthly_storage_trial.py resume
          timeout 120 python -u tools/v4_monthly_storage_trial.py duplicate
          timeout 120 python -u tools/v4_monthly_storage_trial.py verify
          timeout 120 python -u tools/v4_monthly_storage_trial.py rollover
          timeout 120 python -u tools/v4_monthly_storage_trial.py finish
  archive-storage-trial:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && inputs.purpose == 'archive-storage-trial' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate private encrypted secondary archives with existing credentials only
        env:
          GH_TOKEN: ${{ github.token }}
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: |
          timeout 120 python -u tools/v4_release_archive_trial.py prepare
          timeout 120 python -u tools/v4_release_archive_trial.py synthetic
          timeout 120 python -u tools/v4_release_archive_trial.py recover
          timeout 120 python -u tools/v4_release_archive_trial.py verify-synthetic
          timeout 120 python -u tools/v4_release_archive_trial.py shadow
          timeout 120 python -u tools/v4_release_archive_trial.py verify-shadow
          timeout 120 python -u tools/v4_release_archive_trial.py rollback
  research:
    if: ${{ vars.BCT_V4_CPU_CODE_SHA == '221fa92b1cbff8950716ec373eac793ca340c873' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && vars.BCT_V4_CPU_RESEARCH_ENABLED == 'true' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - name: Require a reviewed immutable code SHA
        run: test "${#CPU_CODE_SHA}" = 40 && [[ "$CPU_CODE_SHA" =~ ^[0-9a-f]+$ ]] && test "$CPU_CODE_SHA" = "$EXPECTED_CPU_CODE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CPU_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.15'
      - name: Free guard and exact existing runtime key
        id: key
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          LOCK_SHA: ${{ hashFiles('scripts/v4/requirements.lock','docs/v4/cpu-automation/preflight/model-manifest.json') }}
        run: |
          timeout 120 python tools/v4_cpu_preflight.py guard --output var/v4/cpu-private/free.json
          echo "key=v4-cpu-runtime-${RUNNER_OS}-${RUNNER_ARCH}-${PYTHON_VERSION}-${LOCK_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
          path: |
            .v4-cpu-env
            .v4-cpu-runtime
      - uses: actions/cache/restore@v4
        with:
          key: v4-cpu-private-bridge-prior-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v4-cpu-private-bridge-
          fail-on-cache-miss: true
          path: var/v4/cpu-private/bridge
      - name: Authenticate and restore private input; missing/corrupt stops
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/bridge/state.gpg --checkpoint var/v4/cpu-private/prior
      - name: Verify original scheduled RSS and receive existing data only
        env:
          ACQUISITION_RUN: ${{ github.event.workflow_run.id }}
        run: |
          timeout 120 python - <<'PYCODE'
          from bct.v4.cpu_operations import github_schedule_context,verified_schedule
          import os
          proof=verified_schedule(github_schedule_context())
          with open(os.environ['GITHUB_ENV'],'a')as out:out.write('RSS_RUN='+str(proof['RSS_run_id'])+'\n')
          PYCODE
          timeout 120 gh run download "$RSS_RUN" --name rss-live-result --dir var/v4/cpu-private/rss
          timeout 120 gh run download "$ACQUISITION_RUN" --name precursor-private-cache --dir var/v4/cpu-private/source
      - name: Consume approved new windows with the existing bounded CPU queue
        run: timeout 120 .v4-cpu-env/bin/python tools/v4_cpu_private.py process --checkpoint var/v4/cpu-private/prior --output var/v4/cpu-private/observation.json
      - name: Seal output; only ciphertext crosses jobs
        run: timeout 120 python tools/v4_cpu_private.py seal --checkpoint var/v4/cpu-private/next-checkpoint --packet var/v4/cpu-private/result/state.gpg --parent-file var/v4/cpu-private/prior/parent.json
      - uses: actions/cache/save@v4
        with:
          key: v4-cpu-private-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/v4/cpu-private/result
  publish:
    needs: research
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.research.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
    steps:
      - name: Require a reviewed immutable code SHA
        run: test "${#CPU_CODE_SHA}" = 40 && [[ "$CPU_CODE_SHA" =~ ^[0-9a-f]+$ ]] && test "$CPU_CODE_SHA" = "$EXPECTED_CPU_CODE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CPU_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Free/cache guard; private repo is storage only, no private Actions
        run: timeout 120 python tools/v4_cpu_preflight.py guard --output var/v4/cpu-private/free.json
      - name: Prepare existing verified seed without rereading or empty reset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'seed' }}
        run: timeout 120 python tools/v4_cpu_private.py prepare-seed
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          key: v4-cpu-private-result-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
          path: var/v4/cpu-private/result
      - name: Authenticate CPU result, no model or upstream code execution
        if: ${{ github.event_name == 'workflow_run' }}
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/result/state.gpg --checkpoint var/v4/cpu-private/checkpoint
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        with:
          key: v4-cpu-private-bridge-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v4-cpu-private-bridge-
          fail-on-cache-miss: true
          path: var/v4/cpu-private/bridge
      - name: Restore actual private research state for CAS recovery test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/bridge/state.gpg --checkpoint var/v4/cpu-private/checkpoint
      - name: Prove stale-parent storage refusal without changing remote state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          timeout 120 python - <<'PYCODE'
          import json,os,pathlib
          from bct.v4 import private_state as p
          proof=json.loads(pathlib.Path('docs/v4/cpu-automation/preflight/connection-results.json').read_text())
          scope=proof['actual_remote_evidence']['receipts']['BCT_PRIVATE_SCOPE_JSON']['scope']
          try:
              p.publish('var/v4/cpu-private/git','var/v4/cpu-private/checkpoint','0'*40,
                  os.environ['BCT_V4_PRIVATE_STATE_TOKEN'],{},verified_scope=scope)
          except ValueError as error:
              assert str(error)=='RESEARCH_STATE_PARENT_CHANGED_NO_OVERWRITE'
              print('BCT_EXPECTED_STORAGE_FAILURE_JSON='+json.dumps({'status':'PASS_EXPECTED_CAS_STALE_PARENT_REFUSAL','remote_overwrite':False,'new_CPU_windows':0}))
          else:raise AssertionError('STALE_PARENT_MUST_NOT_WRITE')
          PYCODE
      - name: Recover latest durable private state after incomplete forwarding
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'bridge-recover' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          timeout 120 python - <<'PYCODE'
          import os,json,pathlib,subprocess,base64
          from bct.v4 import private_state as p,cpu_operations as o,cpu_resume as r
          repo=pathlib.Path('var/v4/cpu-private/git');repo.mkdir(parents=True,exist_ok=False)
          auth=base64.b64encode(('x-access-token:'+os.environ['BCT_V4_PRIVATE_STATE_TOKEN']).encode()).decode()
          env={**os.environ,'GIT_CONFIG_COUNT':'2','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader',
              'GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth,'GIT_CONFIG_KEY_1':'credential.helper',
              'GIT_CONFIG_VALUE_1':'','GIT_TERMINAL_PROMPT':'0'}
          def git(*args):
              process=subprocess.run(['git','-C',str(repo),*args],env=env,capture_output=True,timeout=25)
              if process.returncode:raise ValueError('PRIVATE_RECOVERY_GIT_FAILED')
              return process.stdout
          git('init');git('remote','add','origin',p.PRIVATE_URL)
          git('fetch','--no-tags','origin',o.STATE_REF)
          commit=git('rev-parse','FETCH_HEAD').decode().strip()
          checkpoint=pathlib.Path('var/v4/cpu-private/checkpoint');checkpoint.mkdir(parents=True,exist_ok=False)
          for name in ('checkpoint.json','checkpoint.sqlite3.gz'):(checkpoint/name).write_bytes(git('show',commit+':'+name))
          restored=o.restore(checkpoint,pathlib.Path('var/v4/cpu-private/recovered-durable'))
          ledger=r.Ledger('var/v4/cpu-private/recovered-durable');r.audit(ledger);ledger.close()
          (checkpoint/'parent.json').write_text(json.dumps({'expected_parent':commit}))
          print('BCT_DURABLE_BRIDGE_RECOVERY_JSON='+json.dumps({'status':'PASS_RECOVERED_FROM_PRIVATE_NOT_OLD_CACHE','parent':commit,'restored':restored,'model_loads':0,'originals_modified':False}))
          PYCODE
      - name: Private CAS publish and fresh remote hash/table restore
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          if test -f var/v4/cpu-private/checkpoint/parent.json; then
            timeout 120 python tools/v4_cpu_private.py publish --reuse-verified-scope --parent-file var/v4/cpu-private/checkpoint/parent.json --output var/v4/cpu-private/published.json
          else
            timeout 120 python tools/v4_cpu_private.py publish --reuse-verified-scope --output var/v4/cpu-private/published.json
          fi
      - name: New-process remote research restore and dedup validation; no CPU load
        env:
          CONFIGURED_CPU_CODE_SHA: ${{ vars.BCT_V4_CPU_CODE_SHA }}
          CONFIGURED_CPU_ENABLED: ${{ vars.BCT_V4_CPU_RESEARCH_ENABLED }}
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' }}
        run: |
          timeout 120 python - <<'PYCODE'
          import json,pathlib,subprocess,tempfile,sqlite3
          from bct.v4 import cpu_resume as resume,cpu_operations as op
          from tools.v4_cpu_resume import unpack
          result=json.loads(pathlib.Path('var/v4/cpu-private/published.json').read_text())
          repo='var/v4/cpu-private/git';commit=result['commit']
          assert result['remote_restore_verified']is True
          assert subprocess.check_output(['git','-C',repo,'rev-parse','FETCH_HEAD'],text=True).strip()==commit
          with tempfile.TemporaryDirectory(prefix='bct-remote-resume-')as tmp:
              root=pathlib.Path(tmp);packet=root/'remote';packet.mkdir()
              for name in ('checkpoint.json','checkpoint.sqlite3.gz'):
                  (packet/name).write_bytes(subprocess.check_output(['git','-C',repo,'show',commit+':'+name]))
              restored=op.restore(packet,root/'restored')
              ledger=resume.Ledger(root/'restored');safe=resume.audit(ledger)
              assert restored['sqlite_sha256']==result['persistence_receipt']['sqlite_sha256']
              checked=set();held=0
              for archive,proof,dest in [
                  ('docs/v4/cpu-automation/ledger.sqlite3.gz',json.loads(pathlib.Path('docs/v4/cpu-automation/storage-proof.json').read_text())['ledger'],root/'original-q'),
                  ('docs/v4/cpu-recovery/research-snapshot.sqlite3.gz',json.loads(pathlib.Path('docs/v4/cpu-recovery/storage-proof.json').read_text()),root/'original-old')]:
                  original=unpack(archive,proof,dest)
                  with sqlite3.connect(original.as_uri()+'?mode=ro',uri=True)as db:
                      for payload, in db.execute('SELECT payload FROM documents'):
                          doc=json.loads(payload)
                          if resume.completed(ledger,doc):
                              checked.add(resume.key(doc))
                              assert resume.verify(ledger,doc['document_id'],{'start':0,'end':1,'quote':doc['body'][:1]})['status']=='HELD_SOURCE_WITHHELD'
              assert len(checked)==safe['completed_body_keys']==41
              ledger.close()
          print('BCT_RESEARCH_RESUME_JSON='+json.dumps({'status':'PASS_ACTUAL_PRIVATE_RESEARCH_RESTART',
              'fixed_code_SHA':__import__('os').environ['CPU_CODE_SHA'],
              'configured_code_SHA':__import__('os').environ['CONFIGURED_CPU_CODE_SHA'],
              'configured_code_matches':__import__('os').environ['CONFIGURED_CPU_CODE_SHA']==__import__('os').environ['CPU_CODE_SHA'],
              'configured_enabled':__import__('os').environ['CONFIGURED_CPU_ENABLED'],'remote_commit':commit,
              'remote_restore':restored,'state':safe,'deduplicated_historical_bodies':len(checked),
              'original_source_rows_copied':0,'model_loads':0,'new_CPU_windows':0,
              'seven_day_start':result['persistence_receipt']['seven_day_start'],
              'original_DB_fully_restored':False}))
          PYCODE
      - name: Preserve prior recovery input before producing a fresh bridge
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        run: mv var/v4/cpu-private/bridge var/v4/cpu-private/recovery-input-preserved
      - name: Seal acknowledged private state for next read-only CPU job
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' }}
        run: timeout 120 python tools/v4_cpu_private.py seal --packet var/v4/cpu-private/bridge/state.gpg --parent-file var/v4/cpu-private/published.json
      - uses: actions/cache/save@v4
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' }}
        with:
          key: v4-cpu-private-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/v4/cpu-private/bridge
# No raw DB/source artifact upload, code execution from upstream, public Git writes,
# model setup, RSS refetch, external AI, automatic S2/S3, LIVE or UI deployment.
# Source-separated schema enforced before encryption/publication. No original3 copied.
# Seven-day start exists only after publisher remote restore and receipt ACK.

  q1-key:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && inputs.purpose == 'q1-transfer-key' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare one-use public encryption recipient; reuse existing passphrase
        env:
          GH_TOKEN: ${{ github.token }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: timeout 120 python tools/v4_quantitative_private.py prepare
      - uses: actions/cache/save@v4
        with:
          key: v4-q1-wrapped-transport-key-${{ github.run_id }}
          path: var/v4/quantitative/q1-transfer
  q1-publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && inputs.purpose == 'q1-publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          key: v4-q1-wrapped-transport-key-${{ inputs.q1_key_run }}
          fail-on-cache-miss: true
          path: var/v4/quantitative/q1-transfer
      - name: Publish audited facts only using existing private-only writer
        env:
          GH_TOKEN: ${{ github.token }}
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
          Q1_KEY_RUN: ${{ inputs.q1_key_run }}
          Q1_BLOB_SHA: ${{ inputs.q1_blob_sha }}
          Q1_PACKET_SHA: ${{ inputs.q1_packet_sha }}
        run: timeout 120 python tools/v4_quantitative_private.py publish

  q1-connectivity:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && inputs.purpose == 'q1-connectivity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check existing Secret delivery and official responses without printing values
        env:
          BCT_SEC_USER_AGENT: ${{ secrets.BCT_SEC_USER_AGENT || vars.BCT_SEC_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 120 python -c 'from bct.v4.cpu_operations import github_guard; github_guard()'
          timeout 120 python tools/v4_quantitative_credentials.py
      - uses: actions/cache/save@v4
        with:
          key: v4-q1-source-probe-${{ github.run_id }}
          path: var/v4/quantitative/q1-source-probe

  q1-source-prior:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bct-v4-integration' && (inputs.purpose == 'q1-source-batch' || inputs.purpose == 'q1-trade-resume' || inputs.purpose == 'q2-review' || inputs.purpose == 'q1-storage-check' || inputs.purpose == 'q1-quality-Q2' || inputs.purpose == 'q1-recover-result' || inputs.purpose == 'q2-counterpart' || inputs.purpose == 'q2-relations') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore existing Q1 private state and seal read-only source handoff
        env:
          GH_TOKEN: ${{ github.token }}
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: timeout 120 python tools/v4_quantitative_batch.py prepare
      - uses: actions/cache/save@v4
        with:
          key: v4-q1-source-prior-${{ github.run_id }}
          path: var/v4/quantitative/q1-source-bridge/prior
  q1-source-process:
    needs: q1-source-prior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          key: v4-q1-source-prior-${{ github.run_id }}
          fail-on-cache-miss: true
          path: var/v4/quantitative/q1-source-bridge/prior
      - uses: actions/cache/restore@v4
        with:
          key: v4-q1-source-probe-38749046126
          fail-on-cache-miss: true
          path: var/v4/quantitative/q1-source-probe
      - uses: actions/cache/restore@v4
        if: ${{ inputs.purpose == 'q1-recover-result' }}
        with:
          key: v4-q1-source-result-38761360115
          fail-on-cache-miss: true
          path: var/v4/quantitative/q1-source-bridge/result
      - name: Continue fixed SEC/Census scopes with no private writer credential or model
        env:
          RECOVER_ONLY: ${{ inputs.purpose == 'q1-recover-result' }}
          QUALITY: ${{ inputs.purpose == 'q1-quality-Q2' }}
          STORAGE_ONLY: ${{ inputs.purpose == 'q1-storage-check' }}
          RELATIONS_ONLY: ${{ inputs.purpose == 'q2-relations' }}
          OBSERVED_CPU_ENABLED: ${{ vars.BCT_V4_CPU_RESEARCH_ENABLED }}
          OBSERVED_CPU_CODE_SHA: ${{ vars.BCT_V4_CPU_CODE_SHA }}
          COUNTERPART_ONLY: ${{ inputs.purpose == 'q2-counterpart' }}
          Q2_ONLY: ${{ inputs.purpose == 'q2-review' }}
          TRADE_ONLY: ${{ inputs.purpose == 'q1-trade-resume' }}
          BCT_SEC_USER_AGENT: ${{ secrets.BCT_SEC_USER_AGENT || vars.BCT_SEC_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: |
          if [ "$RECOVER_ONLY" = true ]; then
            timeout 120 python -u tools/v4_quantitative_batch.py recover
            exit 0
          fi
          if [ "$STORAGE_ONLY" = true ]; then
            timeout 120 python tools/v4_quantitative_batch.py storage
            exit 0
          fi
          if [ "$RELATIONS_ONLY" = true ]; then
            timeout 120 python tools/v4_quantitative_batch.py relations
            exit 0
          fi
          if [ "$COUNTERPART_ONLY" = true ]; then
            timeout 120 python tools/v4_quantitative_batch.py counterparts
            exit 0
          fi
          if [ "$Q2_ONLY" = true ]; then
            timeout 120 python tools/v4_quantitative_batch.py targets
            exit 0
          fi
          action=process
          if [ "$QUALITY" = true ]; then action=quality; fi
          if [ "$TRADE_ONLY" = true ]; then action=trade; fi
          for batch in {1..8}; do
            set +e
            timeout 120 python tools/v4_quantitative_batch.py "$action"
            result=$?
            set -e
            if [ "$result" = 0 ]; then break; fi
            if [ "$result" != 75 ]; then exit "$result"; fi
          done
          timeout 120 python tools/v4_quantitative_batch.py finish
      - uses: actions/cache/save@v4
        with:
          key: v4-q1-source-result-${{ github.run_id }}
          path: var/v4/quantitative/q1-source-bridge/result
  q1-source-publish:
    needs: q1-source-process
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          key: v4-q1-source-result-${{ github.run_id }}
          fail-on-cache-miss: true
          path: var/v4/quantitative/q1-source-bridge/result
      - name: Publish Q1 facts to its private ref and verify remote fresh-process restore
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
          BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
        run: |
          timeout 120 python -u tools/v4_quantitative_batch.py publish
          timeout 120 python -u tools/v4_quantitative_batch.py verify
