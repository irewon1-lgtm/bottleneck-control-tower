# Automatic reading requires matching reviewed Variables and enabled=true.
# Explicit manual-research is separately authorized actual input, scheduled=false.
# Source-separated private seed and recovery have passed; never repeat connection probes.
# Replace the old public write-token proposal; no public contents:write, no raw artifacts/cache.
# Existing main-scoped runtime cache is mandatory. No install/download fallback.
name: V4 CPU private research consumer
on:
  workflow_run:
    workflows: [New precursor evidence acquisition]
    types: [completed]
  workflow_dispatch:
    inputs:
      purpose:
        type: choice
        options: [seed, recovery-check, bridge-recover, recover-public, recover-result, recover-sealed-result, runtime-verify, manual-research]
        default: seed
      acquisition_run:
        type: string
        default: ''
        description: 'Explicit actual input only: successful main acquisition run; scheduled=false, seven-day=null'
      result_run:
        type: string
        default: ''
        description: 'Read-only existing cache recovery or exact failed sealed-result run; no rereading'
      result_attempt:
        type: string
        default: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: v4-cpu-private-research-single-writer
  cancel-in-progress: false
env:
  PYTHONPATH: src
  CPU_CODE_SHA: 6e788d18cf85fdb834b451bb35585a8b58925301
  EXPECTED_CPU_CODE_SHA: 6e788d18cf85fdb834b451bb35585a8b58925301
jobs:
  runtime-verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.purpose == 'runtime-verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CPU_CODE_SHA }}
          path: pinned-cpu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Require standard free runner and existing cache budget without installation
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: pinned-cpu/src
        run: timeout 120 python pinned-cpu/tools/v4_cpu_preflight.py guard --output var/v4/runtime-verify/free.json
      - uses: actions/cache/restore@v4
        with:
          key: v4-cpu-runtime-${{ runner.os }}-${{ runner.arch }}-3.12.15-fff880f684241e7320bcb1f19eecf3f5ad9a32f15f730cc2351aae63c13bda10
          fail-on-cache-miss: true
          path: |
            .v4-cpu-env
            .v4-cpu-runtime
      - name: Verify locked packages and offline model health using pinned execution code without reading
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: timeout 120 .v4-cpu-env/bin/python pinned-cpu/tools/v4_cpu_runtime_verify.py --code-root pinned-cpu --expected-code-pin "$CPU_CODE_SHA"
  research:
    if: ${{ github.ref == 'refs/heads/main' && ((vars.BCT_V4_CPU_CODE_SHA == '6e788d18cf85fdb834b451bb35585a8b58925301' && github.event_name == 'workflow_run' && vars.BCT_V4_CPU_RESEARCH_ENABLED == 'true' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.purpose == 'manual-research')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - name: Require a reviewed immutable code SHA
        run: test "${#CPU_CODE_SHA}" = 40 && [[ "$CPU_CODE_SHA" =~ ^[0-9a-f]+$ ]] && test "$CPU_CODE_SHA" = "$EXPECTED_CPU_CODE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CPU_CODE_SHA }}
          persist-credentials: false
      - name: Check out current reviewed ciphertext-transfer helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .bct-sealed-handoff
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/scripts/v4_cpu_sealed_handoff.py
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.15'
      - name: Free guard and exact existing runtime key
        id: key
        env:
          PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
          LOCK_SHA: ${{ hashFiles('scripts/v4/requirements.lock','docs/v4/cpu-automation/preflight/model-manifest.json') }}
        run: |
          timeout 120 python tools/v4_cpu_preflight.py guard --output var/v4/cpu-private/free.json
          echo "key=v4-cpu-runtime-${RUNNER_OS}-${RUNNER_ARCH}-${PYTHON_VERSION}-${LOCK_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
          path: |
            .v4-cpu-env
            .v4-cpu-runtime
      - uses: actions/cache/restore@v4
        with:
          key: v4-cpu-private-bridge-prior-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v4-cpu-private-bridge-
          fail-on-cache-miss: false
          path: var/v4/cpu-private/bridge
      - name: Restore latest acknowledged encrypted bridge or verify legacy bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 120 python .bct-sealed-handoff/.github/scripts/v4_cpu_sealed_handoff.py latest-bridge --destination var/v4/cpu-private/bridge/state.gpg --allow-existing-bootstrap
      - name: Authenticate and restore private input; missing/corrupt stops
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/bridge/state.gpg --checkpoint var/v4/cpu-private/prior
      - name: Verify actual upstream identity without relabeling manual input as schedule
        env:
          MANUAL_ACQUISITION_RUN: ${{ inputs.acquisition_run }}
        run: |
          timeout 120 python - <<'PYCODE'
          from bct.v4.cpu_operations import github_schedule_context,verified_schedule,github_manual_context,verified_manual_input
          import os
          manual=os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
          context=github_manual_context(int(os.environ['MANUAL_ACQUISITION_RUN'])) if manual else github_schedule_context()
          proof=verified_manual_input(context) if manual else verified_schedule(context)
          with open(os.environ['GITHUB_ENV'],'a')as out:
              out.write('RSS_RUN='+str(proof['RSS_run_id'])+'\n')
              out.write('RSS_ATTEMPT='+str(proof['RSS_run_attempt'])+'\n')
              out.write('ACQUISITION_RUN='+str(context['acquisition_run']['id'])+'\n')
              out.write('ACQUISITION_ATTEMPT='+str(proof['acquisition_run_attempt'])+'\n')
              out.write('ACQUISITION_HEAD='+context['acquisition_run']['head_sha']+'\n')
          PYCODE
      - name: Receive exact small delta and older pending versions; no full history download
        env:
          BCT_V4_STATE_PASSPHRASE: ''
        run: |
          set -euo pipefail
          timeout 120 gh run download "$RSS_RUN" --name "rss-live-result-$RSS_ATTEMPT" --dir var/v4/cpu-private/rss
          # The 10-minute job still caps receive + pinned processing; source
          # download/hash/extraction has a separate finite 300-second budget.
          timeout 300 python .github/scripts/receive_cpu_delta.py \
            --run-id "$ACQUISITION_RUN" --expected-head "$ACQUISITION_HEAD" \
            --run-attempt "$ACQUISITION_ATTEMPT" --rss-run-attempt "$RSS_ATTEMPT" \
            --rss-run-id "$RSS_RUN" --rss-manifest var/v4/cpu-private/rss/new-document-manifest.json \
            --checkpoint var/v4/cpu-private/prior --destination var/v4/cpu-private/source \
            --receipt var/v4/cpu-private/input-receipt.json
          cp var/v4/cpu-private/source/cpu-manifest.json var/v4/cpu-private/rss/new-document-manifest.json
      - name: Consume approved new windows with the existing bounded CPU queue
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then args+=(--manual-acquisition-run "$ACQUISITION_RUN"); fi
          timeout 120 .v4-cpu-env/bin/python tools/v4_cpu_private.py process --checkpoint var/v4/cpu-private/prior --input-receipt var/v4/cpu-private/input-receipt.json --output var/v4/cpu-private/observation.json "${args[@]}"
      - name: Seal output; only ciphertext crosses jobs
        run: timeout 120 python tools/v4_cpu_private.py seal --checkpoint var/v4/cpu-private/next-checkpoint --packet var/v4/cpu-private/result/state.gpg --parent-file var/v4/cpu-private/prior/parent.json
      - name: Upload only AES256-GPG sealed CPU result; fail on missing packet
        uses: actions/upload-artifact@v4
        with:
          name: bct-sealed-cpu-result-${{ github.run_attempt }}
          path: var/v4/cpu-private/result/state.gpg
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: research
    if: ${{ always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && (inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-public' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result')) || needs.research.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BCT_V4_STATE_PASSPHRASE: ${{ secrets.BCT_V4_STATE_PASSPHRASE }}
    steps:
      - name: Require a reviewed immutable code SHA
        run: test "${#CPU_CODE_SHA}" = 40 && [[ "$CPU_CODE_SHA" =~ ^[0-9a-f]+$ ]] && test "$CPU_CODE_SHA" = "$EXPECTED_CPU_CODE_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CPU_CODE_SHA }}
          persist-credentials: false
      - name: Check out current reviewed ciphertext-transfer helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .bct-sealed-handoff
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/scripts/v4_cpu_sealed_handoff.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Free/cache guard; private repo is storage only, no private Actions
        run: timeout 120 python tools/v4_cpu_preflight.py guard --output var/v4/cpu-private/free.json
      - name: Verify exact failed CPU result producer and cache identity
        id: recover
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-result' }}
        env:
          RESULT_RUN: ${{ inputs.result_run }}
          RESULT_ATTEMPT: ${{ inputs.result_attempt }}
        run: timeout 120 python tools/v4_cpu_result_recover.py verify --run-id "$RESULT_RUN" --attempt "$RESULT_ATTEMPT" --output var/v4/cpu-private/recover-identity.json
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-result' }}
        with:
          key: ${{ steps.recover.outputs.cache_key }}
          fail-on-cache-miss: true
          path: var/v4/cpu-private/result
      - name: Authenticate saved failed CPU result without rereading
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-result' }}
        env:
          RESULT_RUN: ${{ inputs.result_run }}
          RESULT_ATTEMPT: ${{ inputs.result_attempt }}
        run: timeout 120 python tools/v4_cpu_result_recover.py authenticate --run-id "$RESULT_RUN" --attempt "$RESULT_ATTEMPT" --output var/v4/cpu-private/recovered-result.json
      - name: Recover a prior failed sealed CPU result without rerunning the model
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-sealed-result' }}
        env:
          RESULT_RUN: ${{ inputs.result_run }}
          RESULT_ATTEMPT: ${{ inputs.result_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 120 python .bct-sealed-handoff/.github/scripts/v4_cpu_sealed_handoff.py recover-result --run-id "$RESULT_RUN" --attempt "$RESULT_ATTEMPT" --destination var/v4/cpu-private/result/state.gpg
          timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/result/state.gpg --checkpoint var/v4/cpu-private/checkpoint
      - name: Prepare existing verified seed without rereading or empty reset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'seed' }}
        run: timeout 120 python tools/v4_cpu_private.py prepare-seed
      - name: Download only the sealed CPU result produced in this same run
        uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' }}
        with:
          name: bct-sealed-cpu-result-${{ github.run_attempt }}
          path: var/v4/cpu-private/result
      - name: Authenticate CPU result, no model or upstream code execution
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' }}
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/result/state.gpg --checkpoint var/v4/cpu-private/checkpoint
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        with:
          key: v4-cpu-private-bridge-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v4-cpu-private-bridge-
          fail-on-cache-miss: true
          path: var/v4/cpu-private/bridge
      - name: Restore actual private research state for CAS recovery test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        run: timeout 120 python tools/v4_cpu_private.py unseal --packet var/v4/cpu-private/bridge/state.gpg --checkpoint var/v4/cpu-private/checkpoint
      - name: Prove stale-parent storage refusal without changing remote state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          timeout 120 python - <<'PYCODE'
          import json,os,pathlib
          from bct.v4 import private_state as p
          proof=json.loads(pathlib.Path('docs/v4/cpu-automation/preflight/connection-results.json').read_text())
          scope=proof['actual_remote_evidence']['receipts']['BCT_PRIVATE_SCOPE_JSON']['scope']
          try:
              p.publish('var/v4/cpu-private/git','var/v4/cpu-private/checkpoint','0'*40,
                  os.environ['BCT_V4_PRIVATE_STATE_TOKEN'],{},verified_scope=scope)
          except ValueError as error:
              assert str(error)=='RESEARCH_STATE_PARENT_CHANGED_NO_OVERWRITE'
              print('BCT_EXPECTED_STORAGE_FAILURE_JSON='+json.dumps({'status':'PASS_EXPECTED_CAS_STALE_PARENT_REFUSAL','remote_overwrite':False,'new_CPU_windows':0}))
          else:raise AssertionError('STALE_PARENT_MUST_NOT_WRITE')
          PYCODE
      - name: Recover latest durable private state after incomplete forwarding
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'bridge-recover' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          timeout 120 python - <<'PYCODE'
          import os,json,pathlib,subprocess,base64
          from bct.v4 import private_state as p,cpu_operations as o,cpu_resume as r
          repo=pathlib.Path('var/v4/cpu-private/git');repo.mkdir(parents=True,exist_ok=False)
          auth=base64.b64encode(('x-access-token:'+os.environ['BCT_V4_PRIVATE_STATE_TOKEN']).encode()).decode()
          env={**os.environ,'GIT_CONFIG_COUNT':'2','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader',
              'GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth,'GIT_CONFIG_KEY_1':'credential.helper',
              'GIT_CONFIG_VALUE_1':'','GIT_TERMINAL_PROMPT':'0'}
          def git(*args):
              process=subprocess.run(['git','-C',str(repo),*args],env=env,capture_output=True,timeout=25)
              if process.returncode:raise ValueError('PRIVATE_RECOVERY_GIT_FAILED')
              return process.stdout
          git('init');git('remote','add','origin',p.PRIVATE_URL)
          git('fetch','--no-tags','origin',o.STATE_REF)
          commit=git('rev-parse','FETCH_HEAD').decode().strip()
          checkpoint=pathlib.Path('var/v4/cpu-private/checkpoint');checkpoint.mkdir(parents=True,exist_ok=False)
          for name in ('checkpoint.json','checkpoint.sqlite3.gz'):(checkpoint/name).write_bytes(git('show',commit+':'+name))
          restored=o.restore(checkpoint,pathlib.Path('var/v4/cpu-private/recovered-durable'))
          ledger=r.Ledger('var/v4/cpu-private/recovered-durable');r.audit(ledger);ledger.close()
          (checkpoint/'parent.json').write_text(json.dumps({'expected_parent':commit}))
          print('BCT_DURABLE_BRIDGE_RECOVERY_JSON='+json.dumps({'status':'PASS_RECOVERED_FROM_PRIVATE_NOT_OLD_CACHE','parent':commit,'restored':restored,'model_loads':0,'originals_modified':False}))
          PYCODE
      - name: Fetch the existing ACK for public recovery without a private write
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-public' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          timeout 120 python - <<'PYCODE'
          import base64,os,pathlib,subprocess
          from bct.v4 import private_state as p,cpu_operations as o
          repo=pathlib.Path('var/v4/cpu-private/git');repo.mkdir(parents=True,exist_ok=False)
          auth=base64.b64encode(('x-access-token:'+os.environ['BCT_V4_PRIVATE_STATE_TOKEN']).encode()).decode()
          env={**os.environ,'GIT_CONFIG_COUNT':'2','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader',
              'GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth,'GIT_CONFIG_KEY_1':'credential.helper',
              'GIT_CONFIG_VALUE_1':'','GIT_TERMINAL_PROMPT':'0'}
          def git(*args):
              result=subprocess.run(['git','-C',str(repo),*args],env=env,capture_output=True,timeout=25)
              if result.returncode:raise ValueError('PUBLIC_ACK_RECOVERY_FETCH_FAILED')
          git('init');git('remote','add','origin',p.PRIVATE_URL)
          git('fetch','--no-tags','origin',o.STATE_REF)
          print('BCT_PUBLIC_ACK_RECOVERY_FETCHED=READ_ONLY_NO_CPU_NO_PRIVATE_WRITE')
          PYCODE
      - name: Private CAS publish and fresh remote hash/table restore
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        env:
          BCT_V4_PRIVATE_STATE_TOKEN: ${{ secrets.BCT_V4_PRIVATE_STATE_TOKEN }}
        run: |
          if test -f var/v4/cpu-private/checkpoint/parent.json; then
            timeout 120 python tools/v4_cpu_private.py publish --reuse-verified-scope --parent-file var/v4/cpu-private/checkpoint/parent.json --output var/v4/cpu-private/published.json
          else
            timeout 120 python tools/v4_cpu_private.py publish --reuse-verified-scope --output var/v4/cpu-private/published.json
          fi
      - name: New-process remote research restore and dedup validation; no CPU load
        env:
          CONFIGURED_CPU_CODE_SHA: ${{ vars.BCT_V4_CPU_CODE_SHA }}
          CONFIGURED_CPU_ENABLED: ${{ vars.BCT_V4_CPU_RESEARCH_ENABLED }}
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        run: |
          timeout 120 python - <<'PYCODE'
          import json,pathlib,subprocess,tempfile,sqlite3
          from bct.v4 import cpu_resume as resume,cpu_operations as op
          from tools.v4_cpu_resume import unpack
          result=json.loads(pathlib.Path('var/v4/cpu-private/published.json').read_text())
          repo='var/v4/cpu-private/git';commit=result['commit']
          assert result['remote_restore_verified']is True
          assert subprocess.check_output(['git','-C',repo,'rev-parse','FETCH_HEAD'],text=True).strip()==commit
          with tempfile.TemporaryDirectory(prefix='bct-remote-resume-')as tmp:
              root=pathlib.Path(tmp);packet=root/'remote';packet.mkdir()
              for name in ('checkpoint.json','checkpoint.sqlite3.gz'):
                  (packet/name).write_bytes(subprocess.check_output(['git','-C',repo,'show',commit+':'+name]))
              restored=op.restore(packet,root/'restored')
              ledger=resume.Ledger(root/'restored');safe=resume.audit(ledger)
              assert restored['sqlite_sha256']==result['persistence_receipt']['sqlite_sha256']
              checked=set();held=0
              for archive,proof,dest in [
                  ('docs/v4/cpu-automation/ledger.sqlite3.gz',json.loads(pathlib.Path('docs/v4/cpu-automation/storage-proof.json').read_text())['ledger'],root/'original-q'),
                  ('docs/v4/cpu-recovery/research-snapshot.sqlite3.gz',json.loads(pathlib.Path('docs/v4/cpu-recovery/storage-proof.json').read_text()),root/'original-old')]:
                  original=unpack(archive,proof,dest)
                  with sqlite3.connect(original.as_uri()+'?mode=ro',uri=True)as db:
                      for payload, in db.execute('SELECT payload FROM documents'):
                          doc=json.loads(payload)
                          if resume.completed(ledger,doc):
                              checked.add(resume.key(doc))
                              assert resume.verify(ledger,doc['document_id'],{'start':0,'end':1,'quote':doc['body'][:1]})['status']=='HELD_SOURCE_WITHHELD'
              assert len(checked)==41 and safe['completed_body_keys']>=41
              ledger.close()
          print('BCT_RESEARCH_RESUME_JSON='+json.dumps({'status':'PASS_ACTUAL_PRIVATE_RESEARCH_RESTART',
              'fixed_code_SHA':__import__('os').environ['CPU_CODE_SHA'],
              'configured_code_SHA':__import__('os').environ['CONFIGURED_CPU_CODE_SHA'],
              'configured_code_matches':__import__('os').environ['CONFIGURED_CPU_CODE_SHA']==__import__('os').environ['CPU_CODE_SHA'],
              'configured_enabled':__import__('os').environ['CONFIGURED_CPU_ENABLED'],'remote_commit':commit,
              'remote_restore':restored,'state':safe,'deduplicated_historical_bodies':len(checked),
              'original_source_rows_copied':0,'model_loads':0,'new_CPU_windows':0,
              'seven_day_start':result['persistence_receipt']['seven_day_start'],
              'original_DB_fully_restored':False}))
          PYCODE
      - name: Project acknowledged research as strict source-free public counts and pointers
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-public' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        env:
          PUBLIC_RECOVERY_PURPOSE: ${{ inputs.purpose }}
        run: |
          args=(--published var/v4/cpu-private/published.json)
          if [ "$PUBLIC_RECOVERY_PURPOSE" = recover-public ]; then args=(--recover); fi
          timeout 120 python tools/v4_public_research_snapshot.py --private-git var/v4/cpu-private/git \
            "${args[@]}" --output var/v4/cpu-private/public \
            --workflow-sha '${{ github.workflow_sha }}' --execution-sha "$CPU_CODE_SHA"
      - name: Publish only the allowlisted research snapshot and manifest
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-public' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        uses: actions/upload-artifact@v4
        with:
          name: bct-public-research-${{ github.run_attempt }}
          path: |
            var/v4/cpu-private/public/snapshot.json
            var/v4/cpu-private/public/manifest.json
          if-no-files-found: error
      - name: Refresh only the authenticated ACK handoff after successful public recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recover-public' }}
        run: timeout 120 python tools/v4_cpu_private.py prepare-public-bridge --output var/v4/cpu-private/published.json
      - name: Preserve prior recovery input before producing a fresh bridge
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'recovery-check' }}
        run: mv var/v4/cpu-private/bridge var/v4/cpu-private/recovery-input-preserved
      - name: Seal acknowledged private state for next read-only CPU job
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-public' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        run: timeout 120 python tools/v4_cpu_private.py seal --packet var/v4/cpu-private/bridge/state.gpg --parent-file var/v4/cpu-private/published.json
      - name: Upload only acknowledged AES256-GPG bridge for the next scheduled CPU run
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_run' || inputs.purpose == 'manual-research' || inputs.purpose == 'seed' || inputs.purpose == 'recovery-check' || inputs.purpose == 'bridge-recover' || inputs.purpose == 'recover-public' || inputs.purpose == 'recover-result' || inputs.purpose == 'recover-sealed-result' }}
        with:
          name: bct-sealed-cpu-bridge-${{ github.run_attempt }}
          path: var/v4/cpu-private/bridge/state.gpg
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
# No raw DB/source artifact upload, code execution from upstream, public Git writes,
# model setup, RSS refetch, external AI, automatic S2/S3, LIVE or UI deployment.
# Source-separated schema enforced before encryption/publication. No original3 copied.
# Seven-day start exists only after publisher remote restore and receipt ACK.
