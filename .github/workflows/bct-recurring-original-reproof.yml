name: BCT recurring original-source verification backlog (bounded)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *' # Every 2 hours in UTC; at most 24 source requests per run
permissions:
  contents: write
  actions: read
jobs:
  original-proof:
    if: github.repository == 'irewon1-lgtm/bottleneck-control-tower' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # GitHub Actions replaces an older PENDING run in a shared concurrency
    # group even when cancel-in-progress=false. Use a self-only queue; the
    # immutable Future GitHub CAS protects writes against other workflows.
    concurrency:
      group: bct-periodic-original-proof
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-source and CAS regressions, not old Gates
        env:
          PYTHONPATH: .:src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_bct_periodic_original_backfill.py \
            tests/test_future_original_verified_capture.py \
            tests/test_source_metadata_precision.py \
            tests/test_future_store.py
      - name: Audit all active RSS publisher hosts and recheck at most 24 unverified FULL originals
        env:
          PYTHONPATH: .:src
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/bct_original_proof_backfill.py
      - name: Summarize saved proofs, holds and backlog without source bodies
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/bct-owner-reproof/receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,json,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"bct-owner-reproof/receipt.json").read_text())
          print("## Original RSS source reproof (actual saved receipts)")
          print("Status:",r.get("status","UNKNOWN"))
          print("Source attempts:",r.get("source_downloads_attempted",0))
          print("New source+publication proofs saved:",r.get("source_proofs_persisted",0))
          print("Active RSS articles:",r.get("rss_articles","UNKNOWN"))
          print("Screened sidecar articles:",r.get("sidecar_records","UNKNOWN"))
          print("Full bodies still lacking verified original:",(r.get("source_status_counts") or {}).get("full_unverified","UNKNOWN"))
          print("Eligible original-source candidates across publishers:",r.get("all_publisher_eligible","UNKNOWN"))
          print("Distinct eligible publishers:",r.get("eligible_publisher_count","UNKNOWN"))
          print("Per-host rate limit:",r.get("max_host_requests_per_batch",4))
          print("Sidecar source commit:",r.get("source_after","NOT_CONFIRMED"))
          print("Confirmed bottlenecks promoted:",0)
          PY
          else
            echo "Source receipt missing: no new verified data claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bct-recurring-original-proof-receipt
          path: ${{ runner.temp }}/bct-owner-reproof/receipt.json
          retention-days: 14
          if-no-files-found: warn
