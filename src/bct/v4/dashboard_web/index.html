<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1755a6">
  <meta name="description" content="실제 BCT V4 근거 기록으로 섹터별 순위와 자동화·원문 확보·최신 연구 상태를 보는 읽기 전용 화면입니다.">
  <title>BCT V4 미래 병목 탐색판</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231d56a4'/%3E%3Cpath d='M9 30V20h5v10m5 0V15h5v15m5 0V9h5v21' stroke='white' fill='none' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 바로 가기</a>
  <div class="app-shell bct-first-app">
    <header class="bct-main-nav">
      <a href="#overview" class="bct-brand" aria-label="BCT V4 병목 탐색판으로 이동">
        <span class="bct-logo" aria-hidden="true">▥</span><strong>BCT V4</strong>
      </a>
      <nav class="bct-tabs" aria-label="주요 화면">
        <a href="#overview" data-nav="overview">병목 탐색판</a>
        <a href="#news" data-nav="news">최신 뉴스</a>
        <a href="#evidence" data-nav="evidence">섹터별 근거</a>
        <a href="#automation" data-nav="automation">자료 수집 현황</a>
        <a href="#candidates" data-nav="candidates">검토 중인 변화</a>
      </nav>
      <div class="bct-header-actions">
        <label class="bct-reader-toggle" for="bct-large-text" title="이 화면의 글씨를 더 크게 표시합니다. 계정 로그인이 필요하지 않습니다.">
          <input id="bct-large-text" type="checkbox">
          <span>글씨 더 크게</span>
        </label>
        <button type="button" class="bct-refresh" id="refresh" aria-label="저장된 최신 자료 다시 읽기"><span aria-hidden="true">↻</span> 새로고침</button>
        <span class="bct-latest" id="top-latest">최근 반영: 확인 중</span>
      </div>
    </header>
    <div class="workspace">
      <main id="main" tabindex="-1">
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="content">
          <div class="loading">
            <span class="spinner" aria-hidden="true"></span>
            <h1>연구 기록을 불러오는 중입니다</h1>
            <p>저장된 근거와 자동화 상태를 확인하고 있습니다.</p>
          </div>
        </div>
      </main>
      <footer>
        <span>BCT V4 · 미래 병목 탐색 · 로그인 없는 공개 읽기 전용</span>
        <span>화면을 열어도 수집·인공지능 분석·후보 생성은 실행되지 않습니다.</span>
      </footer>
    </div>
  </div>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-top">
      <span>근거 원문 상세 정보</span>
      <button type="button" class="icon-button" id="close-detail" aria-label="상세 닫기">×</button>
    </div>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
